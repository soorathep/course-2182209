_appman.pdf"], "demo": {"title": "Switch discharge and charge and check the two pathways", "steps": ["Minutes 0–2: predict the Li+ and e− arrows, then run one discharge cycle", "Minutes 2–3: pause and point out that e− does not cross the electrolyte/separator", "Minutes 3–5: switch to charge with an external charger shown; ask for predictions before revealing reversed arrows", "Minutes 5–6: switch the Li-ion card to Na-ion. Explain that the pathways are similar but the host must be suitable; an actual cell cannot be converted simply by renaming the ion", "Minutes 6–8: show the zinc-air card and locate O2 in the overall equation. Classify it as using a reactant from air, not as an insertion cell"], "limitations": "This pathway model omits SEI structure, electrolyte side reactions, and detailed anion transport. It does not predict actual voltage or capacity", "type": "Particle simulation and a zinc-air equation card"}, "exit_question": "During Li-ion battery discharge, through which parts do ions and electrons travel?"}, {"number": 9, "title_th": "Cell Potentials Thermodynamics and the Nernst Equation", "title_en": "Cell Potentials Thermodynamics and the Nernst Equation", "data_table": {"headers": ["cCu2+ (mol L−1)", "log10(c/1 M)", "E (V vs SHE)"], "rows": [["1.000", "0", "0.34000"], ["0.100", "−1", "0.31042"], ["0.010", "−2", "0.28084"], ["0.001", "−3", "0.25126"]], "caption": "Teaching data calculated with Nernst at 25 °C: E° = 0.340 V, n = 2, aCu(s) = 1, aCu2+ ≈ c/(1 M). These are not measured values"}, "source_urls": ["https://openstax.org/books/chemistry-2e/pages/17-4-potential-free-energy-and-equilibrium"], "demo": {"title": "Change concentration and observe the Cu2+/Cu potential", "steps": ["Minutes 0–2: set c = 1 M and predict the direction of change after tenfold dilution", "Minutes 2–4: change c to 0.1 and 0.01 M; record E and check with a calculator", "Minutes 4–6: show the points on a log10(c/1 M) axis and find ΔE per decade", "Minutes 6–7: increase c ten <script>
'use strict';
const lessons=JSON.parse(document.getElementById('lessons').textContent);
const R=8.314,F=96485,T=298.15,S=R*T*Math.log(10);
let selected=1;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function field(id,label,value,min,max,step=1){return `<label for="${id}">${label}<input id="${id}" data-label="${esc(label)}" type="number" value="${value}" min="${min}" max="${max}" step="${step}"></label>`}
function select(id,label,options){return `<label for="${id}">${label}<select id="${id}">${options.map(([v,t])=>`<option value="${v}">${t}</option>`).join('')}</select></label>`}
function num(id){const el=document.getElementById(id),label=el.dataset.label||id,raw=String(el.value).trim();if(raw==='')throw new Error(`Enter ${label}`);const x=Number(raw);if(!Number.isFinite(x))throw new Error(`Enter a finite numeric value for ${label}`);if(x<Number(el.min)||x>Number(el.max))throw new Error(`${label} must be between ${el.min} and ${el.max}`);if(['z','ne','electrons'].includes(id)&&!Number.isInteger(x))throw new Error(`${label} must be a whole number`);return x}
function validateControls(){document.querySelectorAll('.controls input,.controls select').forEach(el=>{if(el.tagName==='INPUT')num(el.id)})}
function inputError(error){document.getElementById('result').innerHTML=esc(error.message);document.getElementById('result').classList.toggle('input-error',true);document.getElementById('figure').innerHTML='';document.getElementById('detail').textContent='Correct the indicated value to display the result. Your input has not been changed or replaced with another value for calculation.'}
function equilibrium(action){if(action==='reset'){document.getElementById('eqA').value=8;document.getElementById('eqB').value=4;document.getElementById('eqAdd').value=8;update();return}try{validateControls();const a=num('eqA'),b=num('eqB');let nextA=a,nextB=b;if(action==='add')nextA=a+num('eqAdd');else if(action==='step'){nextA=a-a/4+b/2;nextB=b+a/4-b/2}else return;for(const [id,x] of [['eqA',nextA],['eqB',nextB]]){const el=document.getElementById(id);if(x<Number(el.min)||x>Number(el.max))throw new Error(`Cannot complete this step: ${el.dataset.label} would be outside ${el.min} to ${el.max}; the original amounts are retained`)}document.getElementById('eqA').value=nextA;document.getElementById('eqB').value=nextB;update()}catch(error){inputError(error)}}
function val(id){return document.getElementById(id).value}
function table(t){return `<div class="table-wrap"><table><thead><tr>${t.headers.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${t.rows.map(row=>`<tr>${row.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="small">${esc(t.caption||'Teaching dataset')}</p>`}
function plot(series,xmax,ymax,xlabel,ylabel,xmin=0,ymin=0){const W=720,H=290,L=70,B=55,TOP=20,RIGHT=20;const px=x=>L+(x-xmin)/(xmax-xmin)*(W-L-RIGHT),py=y=>H-B-(y-ymin)/(ymax-ymin)*(H-TOP-B);let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${xlabel} versus ${ylabel}">`;
for(let i=0;i<5;i++){let x=xmin+(xmax-xmin)*i/4,y=ymin+(ymax-ymin)*i/4;s+=`<text x="${px(x)}" y="${H-32}" text-anchor="middle">${Number(x.toPrecision(3))}</text><text x="${L-10}" y="${py(y)+4}" text-anchor="end">${Number(y.toPrecision(3))}</text>`}
s+=`<path d="M${L},${TOP}V${H-B}H${W-RIGHT}" fill="none" stroke="var(--ink)" stroke-width="2"/><text x="${(L+W-RIGHT)/2}" y="${H-5}" text-anchor="middle">${xlabel}</text><text transform="translate(17,${H/2}) rotate(-90)" text-anchor="middle">${ylabel}</text>`;
series.forEach((a,i)=>{s+=`<path d="${a.map((p,k)=>`${k?'L':'M'}${px(p[0]).toFixed(2)},${py(p[1]).toFixed(2)}`).join(' ')}" fill="none" stroke="var(--${i?'amber':'teal'})" stroke-width="3"/>`});return s+'</svg>'}
function copper(ph,e){let g=[0,65490+R*T*Math.log(1e-6)-2*F*e,(91100-2*S*ph-2*F*e)/2,107400-2*S*ph-2*F*e];return ['Cu(s)','Cu²⁺(aq)','Cu₂O(s)','CuO(s)'][g.indexOf(Math.min(...g))]}
