const LAB_SRC = "\"\"\"Class 3 of 2182209 Chemistry for Semiconductor Engineering (2027 draft).\n\nMoles, units and stoichiometry: from a mass of Si to atoms, and from a balanced\nequation to the SiO2 grown on a wafer. Every number on the Class 3 slides and in\nLab 3 comes from this module.\n\nRun `python stoich_lab.py` for a printed summary, or `python stoich_lab.py --json`\nto write stoich-results.json.\n\nData: Avogadro constant (exact, SI 2019); atomic masses from Class 1 (NIST isotopes)\nand the rounded values supplied in the exercises; Si lattice constant 0.5431 nm and\ndensities of crystalline Si (2.329 g/cm3) and thermal SiO2 (2.20 g/cm3) from the CRC\nHandbook. NumPy only, so it also runs in the browser.\n\"\"\"\nimport json\nimport sys\n\nimport numpy as np\n\nNA = 6.02214076e23                       # 1/mol, exact\nM_PRECISE = {\"Si\": 28.0855, \"O\": 15.9994, \"Cu\": 63.546, \"N\": 14.007, \"H\": 1.008, \"S\": 32.06, \"Cl\": 35.45, \"F\": 18.998, \"C\": 12.011}\nM_GIVEN = {\"Si\": 28.1, \"O\": 16.0}         # the rounded values supplied in the exercises\nRHO_SI, RHO_OX = 2.329, 2.20              # g/cm3: crystalline Si, thermal (amorphous) SiO2\nA_SI_NM = 0.5431                          # Si lattice constant, nm; 8 atoms per diamond-cubic cell (Class 2)\n\n\ndef r6(x):\n    if isinstance(x, (list, tuple)):\n        return [r6(v) for v in x]\n    v = round(float(x), 6)\n    return 0.0 if v == 0 else v\n\n\ndef molar_mass(formula, table=None):\n    \"\"\"Molar mass in g/mol of a formula given as {\"Si\": 1, \"O\": 2}.\"\"\"\n    t = table or M_PRECISE\n    return sum(t[el] * n for el, n in formula.items())\n\n\nSIO2 = {\"Si\": 1, \"O\": 2}\n\n\ndef mass_to_atoms(m_g, M):\n    n = m_g / M\n    return {\"m_g\": m_g, \"M\": M, \"n_mol\": n, \"N\": n * NA}\n\n\ndef oxidation(m_si_g, table=M_GIVEN):\n    \"\"\"Si + O2 -> SiO2, complete conversion of m_si_g of Si with excess O2 (mole ratio 1:1:1).\"\"\"\n    n = m_si_g / table[\"Si\"]\n    M_ox = molar_mass(SIO2, table)\n    return {\"m_Si\": m_si_g, \"n_Si\": n, \"M_SiO2\": M_ox, \"m_SiO2\": n * M_ox, \"m_O2\": n * 2 * table[\"O\"],\n            \"balance\": m_si_g + n * 2 * table[\"O\"] - n * M_ox}\n\n\ndef si_density_from_cell():\n    \"\"\"Density of Si from its unit cell: 8 atoms in a cube of edge a.\"\"\"\n    a_cm = A_SI_NM * 1e-7\n    n_per_cm3 = 8 / a_cm ** 3\n    return {\"a_cm\": a_cm, \"atoms_per_cm3\": n_per_cm3, \"rho\": n_per_cm3 * M_PRECISE[\"Si\"] / NA}\n\n\ndef si_consumed_ratio():\n    \"\"\"Thickness of Si consumed per thickness of SiO2 grown: (rho_ox/M_ox) / (rho_Si/M_Si).\"\"\"\n    m_ox = molar_mass(SIO2)\n    return (RHO_OX / m_ox) / (RHO_SI / M_PRECISE[\"Si\"])\n\n\ndef oxide_layer(t_ox_nm, area_cm2=1.0):\n    \"\"\"Grow t_ox_nm of SiO2 on area_cm2 of a Si wafer.\"\"\"\n    k = si_consumed_ratio()\n    V_ox = t_ox_nm * 1e-7 * area_cm2\n    m_ox = V_ox * RHO_OX\n    n = m_ox / molar_mass(SIO2)\n    m_si = n * M_PRECISE[\"Si\"]\n    return {\"t_ox_nm\": t_ox_nm, \"t_si_nm\": k * t_ox_nm, \"m_SiO2_g\": m_ox, \"m_Si_g\": m_si, \"m_O_g\": m_ox - m_si,\n            \"gain_g\": m_ox - m_si, \"n_mol\": n}\n\n\ndef lab_results():\n    ox = oxidation(0.562)\n    return {\n        \"M_SiO2\": molar_mass(SIO2, M_GIVEN), \"ox562\": ox,\n        \"atoms_0p02\": ox[\"n_Si\"] * NA,\n        \"si_density\": si_density_from_cell(),\n        \"ratio\": si_consumed_ratio(),\n        \"layer100\": oxide_layer(100.0),\n        \"sweep\": [oxide_layer(float(t)) for t in range(0, 501, 10)],\n    }\n\n\ndef classroom_results():\n    R = {\"meta\": {\"numpy\": np.__version__, \"scipy\": __import__(\"scipy\").__version__, \"python\": sys.version.split()[0]}}\n    R[\"lecture\"] = {\n        \"NA\": NA, \"M\": M_PRECISE, \"M_given\": M_GIVEN, \"rho_si\": RHO_SI, \"rho_ox\": RHO_OX,\n        \"molar\": [{\"formula\": f, \"M\": molar_mass(c)} for f, c in ((\"Si\", {\"Si\": 1}), (\"SiO2\", SIO2), (\"CuSO4\", {\"Cu\": 1, \"S\": 1, \"O\": 4}), (\"NH3\", {\"N\": 1, \"H\": 3}))],\n        \"atoms_1g\": {el: mass_to_atoms(1.0, M_PRECISE[el]) for el in (\"Si\", \"Cu\")},\n        \"ox281\": oxidation(0.281), \"ox562\": oxidation(0.562),\n        \"si_density\": si_density_from_cell(), \"ratio\": si_consumed_ratio(),\n        \"layer100\": oxide_layer(100.0),\n    }\n    R[\"lab\"] = lab_results()\n    return R\n\n\nif __name__ == \"__main__\":\n    R = classroom_results()\n    if \"--json\" in sys.argv:\n        with open(\"stoich-results.json\", \"w\") as fh:\n            json.dump(R, fh, indent=1)\n        print(\"wrote stoich-results.json\"); sys.exit()\n    L = R[\"lecture\"]\n    for q in L[\"molar\"]:\n        print(f\"M({q['formula']}) = {r6(q['M'])} g/mol\")\n    print(\"1 g Si:\", L[\"atoms_1g\"][\"Si\"])\n    print(\"562 mg Si:\", {k: r6(v) for k, v in L[\"ox562\"].items()})\n    print(\"Si density from the unit cell:\", {k: r6(v) for k, v in L[\"si_density\"].items()})\n    print(\"Si consumed per SiO2 grown:\", r6(L[\"ratio\"]))\n    print(\"100 nm oxide on 1 cm2:\", {k: r6(v) for k, v in L[\"layer100\"].items()})\n";   // embedded copy, so live Python also works when the file is opened locally

/* ---------- tiny SVG chart helpers ---------- */
function svgEl(w,h){return `<svg class="ch" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" font-family="Helvetica Neue,Arial,sans-serif">`}
function niceStep(r,n=5){const raw=r/n,p=Math.pow(10,Math.floor(Math.log10(raw||1)));for(const m of [1,2,2.5,5,10]){if(m*p>=raw-1e-12)return m*p}return 10*p}
function scale(o,lo,hi){const st=niceStep(hi-lo);o.step=st;o.ymin=Math.floor(lo/st+1e-9)*st;o.ymax=Math.ceil(hi/st-1e-9)*st;o.ticks=Math.round((o.ymax-o.ymin)/st);return o}
function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v||1)));for(const m of [1,1.2,1.5,2,2.5,3,4,5,6,8,10]){if(m*p>=v)return m*p}return 10*p}
function axes(o){ // o: w,h,l,r,t,b,ymin,ymax,xlabels,ylab,ticks

 if (below > 22) s += `<text x="270" y="${s0 + below / 2 + 5}" font-size="15" fill="${C.ink}" text-anchor="middle">SiO₂ that replaced Si</text>`;
 s += `<text x="20" y="${h - 26}" font-size="13" fill="${C.slate}">Cross-section; vertical scale exaggerated.</text><text x="20" y="${h - 9}" font-size="13" fill="${C.slate}">${(100 * k).toFixed(1)}% of the oxide thickness lies below the original surface.</text>`;

let py=null;
async function ensurePy(msg){if(py)return py;msg.textContent="Loading Python in the browser (first time about 5–10 s) ...";
 if(!window.loadPyodide){await new Promise((ok,bad)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/pyodide/v0.29.3/full/pyodide.js";s.onload=ok;s.onerror=()=>bad(new Error("could not load Pyodide"));document.head.appendChild(s)})}
 const p=await loadPyodide();await p.loadPackage(["numpy","scipy"]);
 const src=LAB_SRC||await (await fetch(LAB_FILE)).text();p.FS.writeFile("stoich_lab.py",src);
 await p.runPythonAsync('import sys\nsys.path.insert(0, ".")\nfrom stoich_lab import *');py=p;return p}
async function runCode(){const msg=document.getElementById("liveMsg"),out=document.getElementById("dOut"),t0=performance.now();
 try{const p=await ensurePy(msg);msg.textContent="Running ...";const buf=[];p.setStdout({batched:s=>buf.push(s)});p.setStderr({batched:s=>buf.push(s)});
  try{await p.runPythonAsync(document.getElementById("dCode").value)}catch(e){buf.push(String(e.message||e).split("\n").slice(-4).join("\n"))}
  out.textContent=buf.join("\n")||"(no output)";const m=document.getElementById("dMode");m.className="pill live";m.textContent="LIVE OUTPUT";
  msg.textContent=`Ran in ${((performance.now()-t0)/1000).toFixed(1)} s in the browser`}
 catch(e){msg.textContent="Python could not start: "+e.message+". The recorded output is still available."}}
async function runLive(){const msg=document.getElementById("liveMsg"),t0=performance.now();
 try{const p=await ensurePy(msg);msg.textContent="Solving every model ...";
  const out=await p.runPythonAsync('import importlib, json\nimport stoich_lab as lab\nimportlib.reload(lab)\njson.dumps(lab.classroom_results())');
  R=JSON.parse(out);MODE="live";drawAll();fillDrawer();msg.textContent=`All slides now show a live run (${((performance.now()-t0)/1000).toFixed(1)} s, SciPy ${R.meta.scipy})`}
 catch(e){msg.textContent="Live run failed: "+e.message+". The recorded run is still shown."}}
document.getElementById("runCode").onclick=runCode;
document.getElementById("runLive").onclick=runLive;

(function(){if(!NARR)return;
 const au=document.getElementById("narr"),bar=document.getElementById("nbar"),cap=document.getElementById("cap"),play=document.getElementById("nPlay"),tm=document.getElementById("nTime"),msg=document.getElementById("nMsg");
 document.getElementById("dock").style.display="flex";document.getElementById("help").style.display="none";let on=false,lang="off",slideIdx=-1;
 const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
 lang=ls("cc-lang")||"off";if(lang!=="en")lang="off";const sp=ls("narr-speed");if(sp)document.getElementById("nSpeed").value=sp;
 const fmtT=t=>isFinite(t)?`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,"0")}`:"0:00";
 const S_=i=>NARR.slides[i];
 function load(i){slideIdx=i;const s=S_(i);if(!s){au.removeAttribute("src");return}au.src=s.file;au.playbackRate=+document.getElementById("nSpeed").value;tm.textContent=`0:00 / ${fmtT(s.duration)}`;showCap(0)}
 function setPlayUI(){play.textContent=au.paused?"▶ Play":"❚❚ Pause";play.classList.toggle("on",!au.paused)}
 // captions sit in their own band under the slide; long lines shrink to fit the band
 window.capRefit=()=>{let f=parseFloat(cap.dataset.fs)||18;cap.style.fontSize=f+"px";while(cap.scrollHeight>cap.clientHeight+1&&f>11){f-=1;cap.style.fontSize=f+"px"}};
 function showCap(t){const s=S_(slideIdx);let c=null;if(s&&lang!=="off"){for(const q of s.cues){if(t>=q.s-0.05)c=q;else break}}
  const txt=(!c||(au.paused&&au.currentTime===0&&!on))?"":c.en;if(cap.textContent!==txt){cap.textContent=txt;capRefit()}}
 function ccUI(){const b=document.getElementById("nCC");b.textContent=lang==="off"?"CC off":"CC on";b.classList.toggle("on",lang!=="off");CAP_ON=lang!=="off";fit();showCap(au.currentTime||0)}
 window.ccCycle=()=>{lang=lang==="off"?"en":"off";ls("cc-lang",lang);ccUI()};
 // "on" means the student is listening: it starts with Play and ends with Pause or Stop.
 // Slides change only when the student moves; the new slide's narration then starts if "on".
 window.narrToggle=()=>{if(au.paused){on=true;if(slideIdx!==cur)load(cur);if(au.ended)au.currentTime=0;msg.textContent="";au.play().catch(()=>{msg.textContent="Press Play again to start audio."})}else{on=false;au.pause()}};

 document.getElementById("nCC").onclick=ccCycle;
 document.getElementById("nPrev").onclick=()=>show(cur-1);document.getElementById("nNext").onclick=()=>show(cur+1);

 ccUI();setTimeout(()=>{if(slideIdx<0)load(cur)},0);
})();
