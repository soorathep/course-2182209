r\n        hist.append({\"round\": n, \"A\": A, \"B\": B, \"fwd\": kf * A, \"rev\": kr * B})\n    return hist\n\n\ndef equilibrium(total, kf=0.25, kr=0.5):\n    \"\"\"At equilibrium kf A = kr B, so B/A = kf/kr.\"\"\"\n    K = kf / kr\n    A = total / (1 + K)\n    return {\"K\": K, \"A\": A, \"B\": total - A}\n\n\nSAMPLES = [(\"A\", 1.0e-2), (\"B\", 1.0e-3), (\"C\", 1.0e-4)]\n\n\ndef lab_results():\n    after = exchange(16, 4, rounds=40)\n    return {\n        \"samples\": [{\"s\": s, \"h\": h, \"pH\": pH(h)} for s, h in SAMPLES],\n        \"ratio_2_4\": ratio(2, 4),\n        \"pH_0p01_x10\": pH(0.010 / 10),\n        \"oh_at_pH3\": KW / h_from_pH(3),\n        \"series\": dilution_series(),\n        \"pH_1e8\": pH(strong_acid_h(1e-8)),\n        \"start\": exchange(8, 4, rounds=0)[0],\n        \"after1\": after[1], \"rounds\": after,\n        \"eq20\": equilibrium(20),\n    }\n\n\ndef classroom_results():\n    R = {\"meta\": {\"numpy\": np.__version__, \"scipy\": __import__(\"scipy\").__version__, \"python\": sys.version.split()[0]}}\n    R[\"lecture\"] = {\n        \"samples\": [{\"s\": s, \"h\": h, \"pH\": pH(h), \"oh\": KW / h} for s, h in SAMPLES],\n        \"water\": {\"h\": math.sqrt(KW), \"pH\": pH(math.sqrt(KW))},\n        \"ratio_2_4\": ratio(2, 4),\n        \"series\": dilution_series(),\n        \"eq12\": exchange(8, 4, rounds=0)[0],\n        \"after\": exchange(16, 4, rounds=12),\n        \"eq20\": equilibrium(20), \"eq12_eq\": equilibrium(12),\n    }\n    R[\"lab\"] = lab_results()\n    return R\n\n\nif __name__ == \"__main__\":\n    R = classroom_results()\n    if \"--json\" in sys.argv:\n        with open(\"ph-results.json\", \"w\") as fh:\n            json.dump(R, fh, indent=1)\n        print(\"wrote ph-results.json\"); sys.exit()\n    L = R[\"lecture\"]\n    for q in L[\"samples\"]:\n        print(q[\"s\"], \"pH\", r6(q[\"pH\"]), \"[OH-]\", q[\"oh\"])\n    for q in L[\"series\"]:\n        print(\"dilute x10^%d: simple %.2f, full %.3f\" % (q[\"k\"], q[\ /* ---------- tiny SVG chart helpers ---------- */
function svgEl(w,h){return `<svg class="ch" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" font-family="Helvetica Neue,Arial,sans-serif">`}
function niceStep(r,n=5){const raw=r/n,p=Math.pow(10,Math.floor(Math.log10(raw||1)));for(const m of [1,2,2.5,5,10]){if(m*p>=raw-1e-12)return m*p}return 10*p}
function scale(o,lo,hi){const st=niceStep(hi-lo);o.step=st;o.ymin=Math.floor(lo/st+1e-9)*st;o.ymax=Math.ceil(hi/st-1e-9)*st;o.ticks=Math.round((o.ymax-o.ymin)/st);return o}
function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v||1)));for(const m of [1,1.2,1.5,2,2.5,3,4,5,6,8,10]){if(m*p>=v)return m*p}return 10*p}
function axes(o){ // o: w,h,l,r,t,b,ymin,ymax,xlabels,ylab,ticks
  const {w,h,l,r,t,b,ymin,ymax}=o, X=w-l-r, Y=h-t-b, n=o.ticks||5; let s="";
  for(let k=0;k<=n;k++){const v=ymin+(ymax-ymin)*k/n, y=t+Y-(v-ymin)/(ymax-ymin)*Y;
    s+=`<line x1="${l}" x2="${w-r}" y1="${y}" y2="${y}" stroke="${C.mist}" stroke-width="0.8" opacity=".7"/><text x="${l-8}" y="${y+5}" font-size="16" text-anchor="end" fill="${C.ink}">${fmt(v, (o.step||1)<1?1:0)}</text>`}
  s+=`<line x1="${l}" x2="${l}" y1="${t}" y2="${t+Y}" stroke="${C.graphite}" stroke-width="1.5"/>`;
  const z=t+Y-(0-ymin)/(ymax-ymin)*Y; s+=`<line x1="${l}" x2="${w-r}" y1="${Math.min(t+Y,Math.max(t,z))}" y2="${Math.min(t+Y,Math.max(t,z))}" stroke="${C.graphite}" stroke-width="1.5"/>`;
  if(o.ylab)s+=`<text transform="translate(${16},${t+Y/2}) rotate(-90)" font-size="17" text-anchor="middle" fill="${C.ink}">${o.ylab}</text>`;
  return s}
function ymap(o,v){const Y=o.h-o.t-o.b;return o.t+Y-(v-o.ymin)/(o.ymax-o.ymin)*Y}
function legend(items,x,y){let s="";items.forEach((it,i)=>{const yy=y+i*22;s+=it.line?`<line x1="${x}" x2="${x+22}" y1="${yy}" y2="${yy}" stroke="${it.c}" stroke-width="3" ${it.dash?'stroke-dasharray="6 4"':''}/>`:`<rect x="${x}" y="${yy-8}" width="16" height="16" fill="${it.c}" ${it.op?`opacity="${it.op}"`:''}/>`;s+=`<text x="${x+28}" y="${yy+5}" font-size="16" fill="${C.ink}">${it.t}</text>`});return s}
function legendRow(items,x,y){let s="",xx=x;items.forEach(it=>{s+=it.line?`<line x1="${xx}" x2="${xx+20}" y1="${y}" y2="${y}" stroke="${it.c}" stroke-width="3" ${it.dash?'stroke-dasharray="6 4"':''}/>`:`<rect x="${xx}" y="${y-7}" width="14" height="14" fill="${it.c}" ${it.op?`opacity="${it.op}"`:''}/>`;s+=`<text x="${xx+26}" y="${y+5}" font-size="16" fill="${C.ink}">${it.t}</text>`;xx+=38+it.t.length*8.2});return s}

/* Food Manufacture: stacked bars of a [month][oil] matrix, optional line */
function hbar(items,opt={}){ // items: {t,v,c}
  const w=opt.w||640,h=opt.h||330,l=opt.l||250,r=90,t=16,rowh=(h-t-20)/items.length;
  const mx=opt.max||niceMax(Math.max(...items.map(i=>i.v)));let s=svgEl(w,h);
  items.forEach((it,i)=>{const y=t+i*rowh,bw=(w-l-r)*it.v/mx;
    s+=`<text x="${l-12}" y="${y+rowh/2+5}" font-size="16" text-anchor="end" fill="${C.ink}">${it.t}</text><rect x="${l}" y="${y+rowh*0.18}" width="${Math.max(bw,1)}" height="${rowh*0.64}" fill="${it.c}" rx="3"/><text x="${l+bw+8}" y="${y+rowh/2+6}" font-size="17" font-weight="700" fill="${C.ink}">${opt.fmt?opt.fmt(it.v):fmt(it.v)}</text>`});
  s+=`<line x1="${l}" x2="${l}" y1="${t}" y2="${h-20}" stroke="${C.graphite}" stroke-width="1.5"/>`;
  return s+"</svg>"}

S.push({kicker:"Part 2 · Equilibrium", title:"At equilibrium both directions continue at equal rates", html:()=>`<div class="body"><div class="col w55"><ul class="b sm">
<li>Many reactions run both ways: A ⇌ B. Molecules of A become B, and B become A, all the time</li>
<li>Equilibrium is reached when the forward rate equals the reverse rate. The amounts then stop changing</li>
<li>Equal rates, not equal amounts. A and B can stay very different</li>
<li>Water itself is an equilibrium: H<sub>2</sub>O ⇌ H<sup>+</sup> + OH<sup>−</sup></li></ul></div>
<div class="col"><div class="panel"><b style="color:${C.teal};font-size:19px">A counting model</b><div style="font-size:19px;line-height:1.55;margin-top:4px">Each round, 1/4 of the A units become B, and 1/2 of the B units become A.<br>Start: A = 8, B = 4.<br>Forward: 8/4 = 2. Reverse: 4/2 = 2.<br>Equal, so the amounts stay at 8 and 4: <b>equilibrium</b>.</div></div>
<p class="note">A synthetic model with whole units; real reactions involve about 10<sup>23</sup> particles.</p></div></div>`});

function eqSVG(h, n){const w = 560, h0 = 330, l = 60, t = 20, Y = 240, sc = Y / 20; let s = svgEl(w, h0); const q = h[n];
 [["A", q.A, C.teal, 140], ["B", q.B, C.amber, 340]].forEach(([nm, v, c, x]) => {s += `<rect x="${x}" y="${t + Y - v * sc}" width="90" height="${v * sc}" fill="${c}" rx="4"/><text x="${x + 45}" y="${t + Y - v * sc - 8}" font-size="17" font-weight="700" text-anchor="middle" fill="${C.ink}">${v.toFixed(2)}</text><text x="${x + 45}" y="${t + Y + 22}" font-size="17" text-anchor="middle" fill="${C.ink}">${nm}</text>`});
 s += `<line x1="${l + 40}" x2="${w - 40}" y1="${t + Y}" y2="${t + Y}" stroke="${C.graphite}" stroke-width="1.5"/>`;
 s += `<text x="${w / 2}" y="${h0 - 8}" font-size="14" text-anchor="middle" fill="${C.slate}">Round ${q.round}: forward ${q.fwd.toFixed(2)}, reverse ${q.rev.toFixed(2)}${Math.abs(q.fwd - q.rev) < 0.01 ? " (balanced)" : ""}</text>`; return s + "</svg>"}
S.push({kicker:"Part 2 · Demo", title:"Add 8 units of A and watch the system shift", html:()=>`<div class="body"><div class="col w55"><div class="ctrl"><span>Rounds after adding 8 A</span> <input type="range" id="rd" min="0" max="12" step="1" value="0"><b id="rdv"></b></div>
<div class="panel grow"><div class="chart" id="eqch"></div></div></div>
<div class="col"><table class="t" style="font-size:17px" id="eqtab"></table>
<ul class="b xs" style="margin-top:10px"><li>After adding A: 16 and 4. Forward 4, reverse 2, so the net change runs toward B</li>
<li>The shift slows as the rates approach each other</li><li>New equilibrium: A = ${LC().eq20.A.toFixed(2)}, B = ${LC().eq20.B.toFixed(2)}. The ratio B/A is ${LC().eq20.K} again, the same as 4/8 before</li>
<li>Adding a reactant shifts the balance toward products, but A does not disappear</li></ul></div></div>`,
draw:()=>{const H = LC().after, sl = document.getElementById("rd");
 document.getElementById("eqtab").innerHTML = `<tr><th>Round</th><th class="n">A</th><th class="n">B</th><th class="n">B/A</th></tr>` + H.slice(0, 4).map(q => `<tr><td>${q.round}</td><td class="n">${q.A.toFixed(3)}</td><td class="n">${q.B.toFixed(3)}</td><td class="n">${(q.B / q.A).toFixed(3)}</td></tr>`).join("") + `<tr><td>12</td><td class="n">${H[12].A.toFixed(3)}</td><td class="n">${H[12].B.toFixed(3)}</td><td class="n">${(H[12].B / H[12].A).toFixed(3)}</td></tr>`;
 const go = () => {const n = +sl.value; document.getElementById("rdv").textContent = n; document.getElementById("eqch").innerHTML = eqSVG(H, n)}; sl.oninput = go; go()},
py:{title:"The A ⇌ B counting model after adding 8 A", sub:"ph_lab.exchange(16, 4)", code:
`from ph_lab import exchange, equilibrium, r6
for q in exchange(16, 4, rounds=3):
    print(q["round"], r6(q["A"]), r6(q["B"]))
print(equilibrium(20))`,
out:()=>LC().after.slice(0, 4).map(q=>`${q.round} ${py6(q.A)} ${py6(q.B)}`).concat([`{'K': ${py6(LC().eq20.K)}, 'A': ${LC().eq20.A}, 'B': ${LC().eq20.B}}`]).join("\n")},
notes:"This is Le Chatelier's principle without the name. The ratio B/A = kf/kr is the equilibrium constant of the model."});

S.push({kicker:"Part 2 · The equilibrium ratio", title:"One number describes the balance: K", html:()=>`<div class="body"><div class="col w55"><div class="panel"><div class="math" style="font-size:21px;line-height:1.75">
At equilibrium: forward rate = reverse rate<br>k<sub>f</sub>[A] = k<sub>r</sub>[B] &nbsp;→&nbsp; K = [B]/[A] = k<sub>f</sub>/k<sub>r</sub><br>In the model: K = (1/4)/(1/2) = <b>0.5</b></div></div>
<p class="note">k<sub>f</sub>, k<sub>r</sub>: the fractions that react per round. Real K values come from measurements and depend on temperature.</p></div>
<div class="col"><ul class="b sm"><li>K does not change when you add A. The amounts move until their ratio is K again</li><li>K<sub>w</sub> is the same idea for water</li>
<li>Class 9 puts the same ratio, written Q, into the Nernst equation for a cell's voltage; Class 13 uses equilibrium to draw the Pourbaix map</li></ul></div></div>`});

S.push({kicker:"Part 2 · A common mistake", title:"“At equilibrium the reaction has stopped”", html:()=>`<div class="body"><div class="col w55"><div class="act" style="border-color:${C.rust};background:#fbf0ec"><span class="tag" style="background:${C.rust}">THE CLAIM</span>
<div style="font-size:22px;line-height:1.45">“At equilibrium nothing happens, and A and B are equal.”</div></div>
<div class="panel" style="margin-top:16px"><b style="color:${C.teal};font-size:19px">The correction</b><div style="font-size:19px;line-height:1.5;margin-top:4px">
In the model at equilibrium, 2 units go each way every round: both reactions continue. The amounts stay at 8 and 4: constant, not equal. Only the net change is zero.</div></div></div>
<div class="col"><ul class="b sm"><li>The same mistake appears with currents in Class 12: at equilibrium the net current is zero, but the exchange current is not</li></ul>${ART(A3.flat(picDynamic), 220)}</div></div>`});

const N=S.length; let cur=0;
function build(){const host=document.getElementById("slides");host.innerHTML="";
 S.forEach((s,i)=>{const d=document.createElement("section");d.className="slide"+(s.cls?" "+s.cls:"");d.id="s"+(i+1);
  d.innerHTML=(s.kicker&&!s.cls?`<p class="kicker">${s.kicker}</p>`:"")+(s.title?`<h1>${s.title}</h1>`:"")+s.html()+(s.py?`<div class="dhint">D · Python</div>`:"")+`<footer><span>${foot}</span><span>${i+1} / ${N}</span></footer>`;host.appendChild(d)})}
function drawAll(){S.forEach(s=>{if(s.draw)try{s.draw()}catch(e){console.error(e)}})}
function show(i){cur=Math.max(0,Math.min(N-1,i));document.querySelectorAll(".slide").forEach((el,k)=>el.classList.toggle("on",k===cur));
 history.replaceState(null,"",location.search+"#"+(cur+1));fillDrawer();if(window.onSlideChange)onSlideChange(cur);const n=document.getElementById("notes");n.textContent=S[cur].notes||"No notes for this slide."}
let CAP_ON=false;   // set by the narration player; reserves a caption band under the slide
function fit(){const W=innerWidth,H=innerHeight,vp=document.getElementById("viewport"),dock=document.getElementById("dock"),cap=document.getElementById("cap");
 const hasDock=dock.style.display==="flex",barH=hasDock?document.getElementById("nbar").offsetHeight:0;
 let k=Math.min(W/1280,H/720)*0.98,capH=0,fs=0,dockH=0;
 for(let it=0;it<3;it++){if(hasDock&&CAP_ON){const lines=k<0.6?4:2;fs=Math.max(12,Math.min(22,24*k));capH=Math.ceil(lines*fs*1.45)+4}else capH=0;
  dockH=hasDock?capH+barH+(capH?6:0)+14:0;k=Math.min(W/1280,Math.max(120,H-dockH)/720)*0.98}
 const h=720*k,pad=10,top=Math.max(0,(H-h-dockH)/2);
 vp.style.top=(top-pad)+"px";vp.style.bottom="auto";vp.style.height=(h+2*pad)+"px";
 document.getElementById("stage").style.transform=`scale(${k})`;
 if(hasDock){dock.style.top=(top+h+6)+"px";cap.style.display=CAP_ON?"block":"none";cap.style.width=Math.min(1280*k,W-16)+"px";cap.style.height=capH+"px";cap.dataset.fs=fs;if(window.capRefit)capRefit()}}

 if(!p){document.getElementById("dTitle").textContent="No Python on this slide";document.getElementById("dSub").textContent="Slides with a 'D · Python' tag have code and output.";document.getElementById("dCode").value="";document.getElementById("dOut").textContent="";return}

async function runCode(){const msg=document.getElementById("liveMsg"),out=document.getElementById("dOut"),t0=performance.now();
 try{const p=await ensurePy(msg);msg.textContent="Running ...";const buf=[];p.setStdout({batched:s=>buf.push(s)});p.setStderr({batched:s=>buf.push(s)});
  try{await p.runPythonAsync(document.getElementById("dCode").value)}catch(e){buf.push(String(e.message||e).split("\n").slice(-4).join("\n"))}
  out.textContent=buf.join("\n")||"(no output)";const m=document.getElementById("dMode");m.className="pill live";m.textContent="LIVE OUTPUT";
  msg.textContent=`Ran in ${((performance.now()-t0)/1000).toFixed(1)} s in the browser`}
 catch(e){msg.textContent="Python could not start: "+e.message+". The recorded output is still available."}}
async function runLive(){const msg=document.getElementById("liveMsg"),t0=performance.now();
 try{const p=await ensurePy(msg);msg.textContent="Solving every model ...";
  const out=await p.runPythonAsync('import importlib, json\nimport ph_lab as lab\nimportlib.reload(lab)\njson.dumps(lab.classroom_results())');
  R=JSON.parse(out);MODE="live";drawAll();fillDrawer();msg.textContent=`All slides now show a live run (${((performance.now()-t0)/1000).toFixed(1)} s, SciPy ${R.meta.scipy})`}
 catch(e){msg.textContent="Live run failed: "+e.message+". The recorded run is still shown."}}
document.getElementById("runCode").onclick=runCode;
document.getElementById("runLive").onclick=runLive;
