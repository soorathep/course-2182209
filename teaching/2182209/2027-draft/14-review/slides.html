const LAB_FILE = "review_checks.py?v=c14-997474a7";
const LAB_SRC = "\"\"\"Class 14 of 2182209 Chemistry for Semiconductor Engineering (2027 draft).\n\nReview in three stations. Every number on the Class 14 slides and in Lab 14 comes from this\nmodule. The formulas are the same as in the Class 6, 9, 10, 11 and 13 modules; they are\nrepeated here so that this file runs on its own.\n\nRun `python review_checks.py` for a printed summary, or `python review_checks.py --json` to\nwrite review-results.json.\n\nStation 1, materials and doping (Classes 1, 2, 6): Si at 300 K, n_i 1.45e10 cm-3,\nmobilities 1350 and 480 cm2/(V s), 1e16 cm-3 of P.\nStation 2, Cu deposition (Classes 9, 10, 13): 0.100 A, 600 s, 90% efficiency, 10.0 cm2;\nE0(Cu2+/Cu) 0.34 V; acid bath at pH 1.\nStation 3, storage choice (Classes 10, 11): a 3 W, 5 s pulse and a 0.10 W, 1 h load.\nTeaching devices, stated: an EDLC of 4.4 F charged to 2.7 V (usable energy taken as all of\n1/2 C V^2), maximum power 5 W; a Li-ion cell of 100 mAh at 3.7 V, maximum power at 2C.\n\"\"\"\nimport json\nimport math\nimport sys\n\nimport numpy as np\nfrom scipy import constants as sc\n\nQ_E, F = sc.e, sc.physical_constants[\"Faraday constant\"][0]\nRT = sc.R * 298.15\nK = math.log(10) * RT / F\n\n# Station 1\nNI, MU_N, MU_P = 1.45e10, 1350.0, 480.0\nATOMS_SI = 8 / (0.5431e-7) ** 3\n\n\ndef carriers_n(N):\n    n = N / 2 + math.sqrt(N * N / 4 + NI * NI)\n    p = NI * NI / n\n    return {\"n\": n, \"p\": p, \"rho\": 1 / (Q_E * (n * MU_N + p * MU_P))}\n\n\n# Station 2\nM_CU, RHO_CU = 63.546, 8.96\n\n\ndef plate(I, t, eff, area):\n    m = eff * I * t / F / 2 * M_CU\n    return {\"Q\": I * t, \"m_mg\": m * 1e3, \"h_um\": m / RHO_CU / area * 1e4}\n\n\n# Station 3\nEDLC = {\"C\": 4.4, \"V\": 2.7, \"Pmax\": 5.0}\nEDLC[\"E_J\"] = 0.5 * EDLC[\"C\"] * EDLC[\"V\"] ** 2\nBAT = {\"Ah\": 0.100, \"V\": 3.7}\nBAT[\"E_J\"] = BAT[\"Ah\"] * BAT[\"V\"] * 3600\nBAT[\"Pmax\"] = 2 * BAT[\"Ah\"] * BAT[\"V\"]            # 2C\n\n\ndef choose(P, t):\n    \"\"\"Which devices can deliver power P (W) for t (s).\"\"\"\n    need = P * t\n    ok = {}\n    for name, d in ((\"EDLC\", EDLC), (\"battery\", BAT)):\n        ok[name] = {\"energy_ok\": d[\"E_J\"] >= need, \"power_ok\": d[\"Pmax\"] >= P}\n        ok[name][\"ok\"] = ok[name][\"energy_ok\"] and ok[name][\"power_ok\"]\n    return {\"P\": P, \"t\": t, \"E_J\": need, \"fits\": ok}\n\n\ndef lab_results():\n    c = carriers_n(1e16)\n    intr = 1 / (Q_E * NI * (MU_N + MU_P))\n    return {\"s1\": {\"cu2_electrons\": 29 - 2, \"p\": c[\"p\"], \"rho\": c[\"rho\"], \"rho_i\": intr, \"ratio\": intr / c[\"rho\"], \"frac\": 1e16 / ATOMS_SI},\n            \"s2\": {**plate(0.100, 600, 0.90, 10.0), \"E_001\": 0.34 + K / 2 * math.log10(0.010), \"bath_sp\": \"Cu2+\"},\n            \"s3\": {\"pulse\": choose(3.0, 5.0), \"long\": choose(0.10, 3600.0), \"edlc\": EDLC, \"bat\": BAT,\n                   \"table_P\": [0.1, 0.5, 1.0, 2.0, 3.0, 5.0], \"table_t\": [1, 5, 60, 600, 3600]}}\n\n\ndef classroom_results():\n    R = {\"meta\": {\"numpy\": np.__version__, \"scipy\": __import__(\"scipy\").__version__, \"python\": sys.version.split()[0]}}\n    L = lab_results()\n    grid = {f\"{P:g}|{t:g}\": choose(P, t) for P in L[\"s3\"][\"table_P\"] for t in L[\"s3\"][\"table_t\"]}\n    R[\"lecture\"] = {\"grid\": grid, \"K\": K, \"F\": F, \"atoms_si\": ATOMS_SI, \"ni\": NI}\n    R[\"lab\"] = L\n    return R\n\n\nif __name__ == \"__main__\":\n    R = classroom_results()\n    if \"--json\" in sys.argv:\n        with open(\"review-results.json\", \"w\") as fh:\n            json.dump(R, fh, indent=1)\n        print(\"wrote review-results.json\"); sys.exit()\n    s1, s2, s3 = R[\"lab\"][\"s1\"], R[\"lab\"][\"s2\"], R[\"lab\"][\"s3\"]\n    print(\"S1: Cu2+ e- %d; p %.2e; rho %.4f; rho_i %.3e; ratio %.2e; fraction %.1e\" % (s1[\"cu2_electrons\"], s1[\"p\"], s1[\"rho\"], s1[\"rho_i\"], s1[\"ratio\"], s1[\"frac\"]))\n    print(\"S2: Q %.1f C; m %.2f mg; h %.3f um; E(0.010 M) %.4f V; bath %s\" % (s2[\"Q\"], s2[\"m_mg\"], s2[\"h_um\"], s2[\"E_001\"], s2[\"bath_sp\"]))\n    print(\"S3: EDLC %.1f J, %.1f W; battery %.0f J, %.2f W\" % (s3[\"edlc\"][\"E_J\"], s3[\"edlc\"][\"Pmax\"], s3[\"bat\"][\"E_J\"], s3[\"bat\"][\"Pmax\"]))\n    for k in (\"pulse\", \"long\"):\n        c = s3[k]; print(k, \"%.0f J\" % c[\"E_J\"], {n: v[\"ok\"] for n, v in c[\"fits\"].items()})\n";   // embedded copy, so live Python also works when the file is opened locally
let R = RECORDED, MODE = "recorded";
const C = {teal:"#0F6E6B",amber:"#E29A2D",rust:"#BE654C",sky:"#5A91BE",sage:"#83A462",plum:"#995A90",graphite:"#333F4A",sand:"#DFC98F",ink:"#1C242B",slate:"#66727C",mist:"#B9C1C6",paper:"#F3F0EB"};
const fmt = (x,d=0)=>x==null?"–":Number(x).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});

/* ---------- tiny SVG chart helpers ---------- */
function svgEl(w,h){return `<svg class="ch" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" font-family="Helvetica Neue,Arial,sans-serif">`}
function niceStep(r,n=5){const raw=r/n,p=Math.pow(10,Math.floor(Math.log10(raw||1)));for(const m of [1,2,2.5,5,10]){if(m*p>=raw-1e-12)return m*p}return 10*p}
function scale(o,lo,hi){const st=niceStep(hi-lo);o.step=st;o.ymin=Math.floor(lo/st+1e-9)*st;o.ymax=Math.ceil(hi/st-1e-9)*st;o.ticks=Math.round((o.ymax-o.ymin)/st);return o}
function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v||1)));for(const m of [1,1.2,1.5,2,2.5,3,4,5,6,8,10]){if(m*p>=v)return m*p}return 10*p}
function axes(o){ // o: w,h,l,r,t,b,ymin,ymax,xlabels,ylab,ticks
  const {w,h,l,r,t,b,ymin,ymax}=o, X=w-l-r, Y=h-t-b, n=o.ticks||5; let s="";
  for(let k=0;k<=n;k++){const v=ymin+(ymax-ymin)*k/n, y=t+Y-(v-ymin)/(ymax-ymin)*Y;
    s+=`<line x1="${l}" x2="${w-r}" y1="${y}" y2="${y}" stroke="${C.mist}" stroke-width="0.8" opacity=".7"/><text x="${l-8}" y="${y+5}" font-size="16" text-anchor="end" fill="${C.ink}">${fmt(v, (o.step||1)<1?1:0)}</text>`}
  s+=`<line x1="${l}" x2="${l}" y1="${t}" y2="${t+Y}" stroke="${C.graphite}" stroke-width="1.5"/>`;
  const z=t+Y-(0-ymin)/(ymax-ymin)*Y; s+=`<line x1="${l}" x2="${w-r}" y1="${Math.min(t+Y,Math.max(t,z))}" y2="${Math.min(t+Y,Math.max(t,z))}" stroke="${C.graphite}" stroke-width="1.5"/>`;
  if(o.ylab)s+=`<text transform="translate(${16},${t+Y/2}) rotate(-90)" font-size="17" text-anchor="middle" fill="${C.ink}">${o.ylab}</text>`;
  return s}
function ymap(o,v){const Y=o.h-o.t-o.b;return o.t+Y-(v-o.ymin)/(o.ymax-o.ymin)*Y}
function legend(items,x,y){let s="";items.forEach((it,i)=>{const yy=y+i*22;s+=it.line?`<line x1="${x}" x2="${x+22}" y1="${yy}" y2="${yy}" stroke="${it.c}" stroke-width="3" ${it.dash?'stroke-dasharray="6 4"':''}/>`:`<rect x="${x}" y="${yy-8}" width="16" height="16" fill="${it.c}" ${it.op?`opacity="${it.op}"`:''}/>`;s+=`<text x="${x+28}" y="${yy+5}" font-size="16" fill="${C.ink}">${it.t}</text>`});return s}
function legendRow(items,x,y){let s="",xx=x;items.forEach(it=>{s+=it.line?`<line x1="${xx}" x2="${xx+20}" y1="${y}" y2="${y}" stroke="${it.c}" stroke-width="3" ${it.dash?'stroke-dasharray="6 4"':''}/>`:`<rect x="${xx}" y="${y-7}" width="14" height="14" fill="${it.c}" ${it.op?`opacity="${it.op}"`:''}/>`;s+=`<text x="${xx+26}" y="${y+5}" font-size="16" fill="${C.ink}">${it.t}</text>`;xx+=38+it.t.length*8.2});return s}

/* Food Manufacture: stacked bars of a [month][oil] matrix, optional line */
function hbar(items,opt={}){ // items: {t,v,c}
  const w=opt.w||640,h=opt.h||330,l=opt.l||250,r=90,t=16,rowh=(h-t-20)/items.length;
  const mx=opt.max||niceMax(Math.max(...items.map(i=>i.v)));let s=svgEl(w,h);
  items.forEach((it,i)=>{const y=t+i*rowh,bw=(w-l-r)*it.v/mx;
    s+=`<text x="${l-12}" y="${y+rowh/2+5}" font-size="16" text-anchor="end" fill="${C.ink}">${it.t}</text><rect x="${l}" y="${y+rowh*0.18}" width="${Math.max(bw,1)}" height="${rowh*0.64}" fill="${it.c}" rx="3"/><text x="${l+bw+8}" y="${y+rowh/2+6}" font-size="17" font-weight="700" fill="${C.ink}">${opt.fmt?opt.fmt(it.v):fmt(it.v)}</text>`});
  s+=`<line x1="${l}" x2="${l}" y1="${t}" y2="${h-20}" stroke="${C.graphite}" stroke-width="1.5"/>`;
  return s+"</svg>"}

function reveal(bid, aid){const b = document.getElementById(bid); b.onclick = () => {const p = document.getElementById(aid), on = p.style.visibility === "hidden"; p.style.visibility = on ? "visible" : "hidden"; b.textContent = on ? "Hide answers" : "Show answers"}}

const sci = (x, d = 2) => {const e = Math.floor(Math.log10(Math.abs(x))), m = x / 10 ** e; return `${m.toFixed(d)} × 10<sup>${e < 0 ? "−" + (-e) : e}</sup>`};
const pye = (x, d = 2) => x.toExponential(d).replace(/e([+-])(\d)$/, "e$10$2");
/* hide the answer column of a table until the button is pressed */
function hideCol(tid, bid){const cells = [...document.querySelectorAll(`#${tid} td.n`)]; cells.forEach(c => c.style.visibility = "hidden"); const b = document.getElementById(bid);
 b.onclick = () => {const on = cells[0].style.visibility === "hidden"; cells.forEach(c => c.style.visibility = on ? "visible" : "hidden"); b.textContent = on ? "Hide answers" : "Show answers"}}

<tr><td>6</td><td>n-type Si is negatively charged</td><td>Each free electron is balanced by a fixed P<sup>+</sup>: the wafer is neutral</td></tr>

<tr><td>8</td><td>The anode is always negative</td><td>The anode is where oxidation happens; in charging it is positive</td></tr>

S.push({kicker:"Summary", title:"What to take from this half of the course", html:()=>`<div class="body"><div class="col"><ul class="b sm">
<li>Count first: protons and electrons, atoms and moles, carriers, electrons as charge</li>
<li>Know what decides whether: Gibbs energy, the cell potential, the Pourbaix map</li>
<li>Know what decides how fast: overpotential, exchange current, transport</li>
<li>Check every claim against a number, and every number against its source</li></ul></div></div>`});

S.push({kicker:"What comes next", title:"The second half of the course", html:()=>`<div class="body"><div class="col"><ul class="b sm">

<li>Band gaps (Class 6), potentials (Class 9) and the Pourbaix map (Class 13) return when semiconductors meet solutions</li>
<li>Keep your lab answer files: they hold the numbers you will need again</li></ul></div></div>`});
