const LAB_SRC = "\"\"\"Class 11 of 2182209 Chemistry for Semiconductor Engineering (2027 draft).\n\nThe electric double layer and supercapacitors (EDLCs). Every number on the Class 11 slides\nand in Lab 11 comes from this module.\n\nRun `python edlc_lab.py` for a printed summary, or `python edlc_lab.py --json` to write\nedlc-results.json.\n\nSynthetic teaching data, labeled as such: two EDLCs, A (0.200 F) and B (0.100 F), each\ncharged at a constant 0.010 A, with a 1.0 ohm series resistance (ESR) that adds a 0.010 V\nstep when the current starts. The capacitance is found from the slope, C = I dt/dV, by a\nleast-squares line through the points (numpy.polyfit), so the ESR step does not enter it.\nOrder-of-magnitude values, stated: double-layer capacitance about 10 uF/cm2 of real surface;\nactivated carbon about 1000 m2/g. DRAM cell: about 20 fF at 1 V (typical order).\n\"\"\"\nimport json\nimport sys\n\nimport numpy as np\nfrom scipy import constants as sc\n\nI = 0.010                     # A\nESR = 1.0                     # ohm\nCAPS = {\"A\": 0.200, \"B\": 0.100}\nT = np.arange(0, 21, 2.0)     # s\nE_CHARGE = sc.e\n\n\ndef vt(C, t=T, I=I, esr=ESR):\n    \"\"\"Constant-current charge: V = I R + I t / C (synthetic data).\"\"\"\n    return I * esr + I * t / C\n\n\ndef fit_C(t, v, I=I):\n    \"\"\"C = I / (dV/dt), slope from a least-squares line.\"\"\"\n    slope, icpt = np.polyfit(t, v, 1)\n    return {\"slope\": float(slope), \"intercept\": float(icpt), \"C\": float(I / slope)}\n\n\ndef store(C, V=None, Q=None):\n    \"\"\"Q = C V and E = C V^2 / 2, from either V or Q.\"\"\"\n    if V is None:\n        V = Q / C\n    Q = C * V\n    return {\"C\": C, \"V\": V, \"Q\": Q, \"E_J\": 0.5 * C * V * V}\n\n\ndef lab_results():\n    vA, vB = vt(CAPS[\"A\"]), vt(CAPS[\"B\"])\n    fA, fB = fit_C(T, vA), fit_C(T, vB)\n    sA = store(fA[\"C\"], V=1.0)\n    return {\"t\": T.tolist(), \"vA\": [round(float(x), 4) for x in vA], \"vB\": [round(float(x), 4) for x in vB],\n            \"fitA\": fA, \"fitB\": fB, \"I\": I, \"esr_step\": I * ESR,\n            \"t_to_1V\": {\"A\": CAPS[\"A\"] * 1.0 / I, \"B\": CAPS[\"B\"] * 1.0 / I},\n            \"A_1V\": sA, \"A_double\": store(2 * fA[\"C\"], Q=sA[\"Q\"])}\n\n\ndef classroom_results():\n    R = {\"meta\": {\"numpy\": np.__version__, \"scipy\": __import__(\"scipy\").__version__, \"python\": sys.version.split()[0]}}\n    c_area = 10e-6            # F/cm2\n    area = 1000 * 1e4         # cm2/g, 1000 m2/g\n    dram = store(20e-15, V=1.0)\n    R[\"lecture\"] = {\n        \"F_per_g\": c_area * area, \"c_area_uF\": c_area * 1e6, \"area_m2g\": 1000,\n        \"dram\": dram, \"dram_electrons\": dram[\"Q\"] / E_CHARGE,\n        \"vlim\": {\"aqueous\": 1.0, \"organic\": 2.7},\n        \"E_ratio_organic\": (2.7 / 1.0) ** 2,\n        \"compare\": [{\"k\": \"Stores charge by\", \"edlc\": \"ions gathering at the surface\", \"bat\": \"redox reactions in the electrodes\"},\n                    {\"k\": \"Voltage while discharging\", \"edlc\": \"falls in a straight line\", \"bat\": \"stays nearly flat\"},\n                    {\"k\": \"Charge or discharge time\", \"edlc\": \"seconds\", \"bat\": \"tens of minutes to hours\"},\n                    {\"k\": \"Cycle life\", \"edlc\": \"hundreds of thousands\", \"bat\": \"hundreds to thousands\"},\n                    {\"k\": \"Energy per kg\", \"edlc\": \"low\", \"bat\": \"high\"}],\n    }\n    R[\"lab\"] = lab_results()\n    return R\n\n\nif __name__ == \"__main__\":\n    R = classroom_results()\n    if \"--json\" in sys.argv:\n        with open(\"edlc-results.json\", \"w\") as fh:\n            json.dump(R, fh, indent=1)\n        print(\"wrote edlc-results.json\"); sys.exit()\n    L = R[\"lab\"]\n    for k in (\"A\", \"B\"):\n        f = L[\"fit\" + k]; print(\"%s: slope %.4f V/s, intercept %.4f V, C = %.3f F\" % (k, f[\"slope\"], f[\"intercept\"], f[\"C\"]))\n    print(\"time to 1.0 V:\", L[\"t_to_1V\"])\n    print(\"A at 1.0 V:\", L[\"A_1V\"]); print(\"A doubled, same Q:\", L[\"A_double\"])\n    Lc = R[\"lecture\"]; print(\"carbon: %.0f F/g; DRAM: Q %.2e C = %.0f electrons\" % (Lc[\"F_per_g\"], Lc[\"dram\"][\"Q\"], Lc[\"dram_electrons\"]))\n";   // embedded copy, so live Python also works when the file is opened locally

/* ---------- tiny SVG chart helpers ---------- */
function svgEl(w,h){return `<svg class="ch" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" font-family="Helvetica Neue,Arial,sans-serif">`}
function niceStep(r,n=5){const raw=r/n,p=Math.pow(10,Math.floor(Math.log10(raw||1)));for(const m of [1,2,2.5,5,10]){if(m*p>=raw-1e-12)return m*p}return 10*p}
function scale(o,lo,hi){const st=niceStep(hi-lo);o.step=st;o.ymin=Math.floor(lo/st+1e-9)*st;o.ymax=Math.ceil(hi/st-1e-9)*st;o.ticks=Math.round((o.ymax-o.ymin)/st);return o}
function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v||1)));for(const m of [1,1.2,1.5,2,2.5,3,4,5,6,8,10]){if(m*p>=v)return m*p}return 10*p}
function axes(o){ // o: w,h,l,r,t,b,ymin,ymax,xlabels,ylab,ticks
  const {w,h,l,r,t,b,ymin,ymax}=o, X=w-l-r, Y=h-t-b, n=o.ticks||5; let s="";

    s+=`<line x1="${l}" x2="${w-r}" y1="${y}" y2="${y}" stroke="${C.mist}" stroke-width="0.8" opacity=".7"/><text x="${l-8}" y="${y+5}" font-size="16" text-anchor="end" fill="${C.ink}">${fmt(v, (o.step||1)<1?1:0)}</text>`}

  if(o.ylab)s+=`<text transform="translate(${16},${t+Y/2}) rotate(-90)" font-size="17" text-anchor="middle" fill="${C.ink}">${o.ylab}</text>`;
  return s}
function ymap(o,v){const Y=o.h-o.t-o.b;return o.t+Y-(v-o.ymin)/(o.ymax-o.ymin)*Y}
function legend(items,x,y){let s="";items.forEach((it,i)=>{const yy=y+i*22;s+=it.line?`<line x1="${x}" x2="${x+22}" y1="${yy}" y2="${yy}" stroke="${it.c}" stroke-width="3" ${it.dash?'stroke-dasharray="6 4"':''}/>`:`<rect x="${x}" y="${yy-8}" width="16" height="16" fill="${it.c}" ${it.op?`opacity="${it.op}"`:''}/>`;s+=`<text x="${x+28}" y="${yy+5}" font-size="16" fill="${C.ink}">${it.t}</text>`});return s}
function legendRow(items,x,y){let s="",xx=x;items.forEach(it=>{s+=it.line?`<line x1="${xx}" x2="${xx+20}" y1="${y}" y2="${y}" stroke="${it.c}" stroke-width="3" ${it.dash?'stroke-dasharray="6 4"':''}/>`:`<rect x="${xx}" y="${y-7}" width="14" height="14" fill="${it.c}" ${it.op?`opacity="${it.op}"`:''}/>`;s+=`<text x="${xx+26}" y="${y+5}" font-size="16" fill="${C.ink}">${it.t}</text>`;xx+=38+it.t.length*8.2});return s}

/* Food Manufacture: stacked bars of a [month][oil] matrix, optional line */
function hbar(items,opt={}){ // items: {t,v,c}
  const w=opt.w||640,h=opt.h||330,l=opt.l||250,r=90,t=16,rowh=(h-t-20)/items.length;
  const mx=opt.max||niceMax(Math.max(...items.map(i=>i.v)));let s=svgEl(w,h);
  items.forEach((it,i)=>{const y=t+i*rowh,bw=(w-l-r)*it.v/mx;
    s+=`<text x="${l-12}" y="${y+rowh/2+5}" font-size="16" text-anchor="end" fill="${C.ink}">${it.t}</text><rect x="${l}" y="${y+rowh*0.18}" width="${Math.max(bw,1)}" height="${rowh*0.64}" fill="${it.c}" rx="3"/><text x="${l+bw+8}" y="${y+rowh/2+6}" font-size="17" font-weight="700" fill="${C.ink}">${opt.fmt?opt.fmt(it.v):fmt(it.v)}</text>`});

  return s+"</svg>"}

 const EL = {Si: "#8E9AA3", O: "#5A91BE", H: "#E9E4DA", Cu: "#BE654C", Zn: "#0F6E6B", P: "#995A90", B: "#83A462", Li: "#83A462", Co: "#333F4A", Na: "#995A90", Cl: "#83A462", C: "#55616b", S: "#E2C14D", e: "#E29A2D"};

function dlSVG(state){const w = 520, h = 320, x0 = 150; let s = svgEl(w, h);
 s += `<rect x="20" y="30" width="${x0 - 20}" height="260" fill="${C.graphite}" opacity=".85"/>` + T(85, 315, "electrode", C.ink, 13);
 s += `<rect x="${x0}" y="30" width="${w - x0 - 20}" height="260" fill="${C.sky}" opacity=".15"/>` + T(340, 315, "electrolyte", C.ink, 13);
 const sign = state === 0 ? 0 : state === 1 ? -1 : 1;
 for (let k = 0; k < 6; k++){const y = 55 + k * 42;
  if (sign) s += T(x0 - 18, y + 6, sign < 0 ? "−" : "+", "#fff", 22);
  if (sign){const cat = sign < 0; s += `<circle cx="${x0 + 26}" cy="${y}" r="13" fill="${cat ? C.teal : C.plum}"/>` + T(x0 + 26, y + 6, cat ? "+" : "−", "#fff", 18)}}
 const free = [[260, 70, 1], [330, 120, -1], [410, 80, 1], [290, 200, -1], [380, 240, 1], [450, 180, -1], [240, 260, -1], [430, 270, 1]];
 free.forEach(([x, y, q]) => {s += `<circle cx="${x}" cy="${y}" r="11" fill="${q > 0 ? C.teal : C.plum}" opacity=".75"/>` + T(x, y + 5, q > 0 ? "+" : "−", "#fff", 15)});
 if (sign){s += `<line x1="${x0}" x2="${x0 + 26}" y1="296" y2="296" stroke="${C.rust}" stroke-width="2.5"/>` + T(x0 + 13, 312, "d ≈ 0.5 nm", C.rust, 12)}
 s += T(w / 2, 14, sign === 0 ? "No charge on the electrode: ions spread evenly" : sign < 0 ? "Electrode made negative: cations gather at its surface" : "Electrode made positive: anions gather at its surface", C.slate, 13);
 return s + "</svg>"}

function show(i){cur=Math.max(0,Math.min(N-1,i));document.querySelectorAll(".slide").forEach((el,k)=>el.classList.toggle("on",k===cur));
 history.replaceState(null,"",location.search+"#"+(cur+1));fillDrawer();if(window.onSlideChange)onSlideChange(cur);const n=document.getElementById("notes");n.textContent=S[cur].notes||"No notes for this slide."}

function fit(){const W=innerWidth,H=innerHeight,vp=document.getElementById("viewport"),dock=document.getElementById("dock"),cap=document.getElementById("cap");
 const hasDock=dock.style.display==="flex",barH=hasDock?document.getElementById("nbar").offsetHeight:0;
 let k=Math.min(W/1280,H/720)*0.98,capH=0,fs=0,dockH=0;
 for(let it=0;it<3;it++){if(hasDock&&CAP_ON){const lines=k<0.6?4:2;fs=Math.max(12,Math.min(22,24*k));capH=Math.ceil(lines*fs*1.45)+4}else capH=0;
  dockH=hasDock?capH+barH+(capH?6:0)+14:0;k=Math.min(W/1280,Math.max(120,H-dockH)/720)*0.98}
 const h=720*k,pad=10,top=Math.max(0,(H-h-dockH)/2);
 vp.style.top=(top-pad)+"px";vp.style.bottom="auto";vp.style.height=(h+2*pad)+"px";

 if(hasDock){dock.style.top=(top+h+6)+"px";cap.style.display=CAP_ON?"block":"none";cap.style.width=Math.min(1280*k,W-16)+"px";cap.style.height=capH+"px";cap.dataset.fs=fs;if(window.capRefit)capRefit()}}
