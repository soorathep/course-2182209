\n    \"znair\": {\"name\": \"zinc-air\", \"neg\": \"Zn\", \"pos\": \"air electrode\", \"electrolyte\": \"KOH(aq)\",\n              \"neg_rx\": (\"Zn + 2OH\u2212 \u2192 ZnO + H2O + 2e\u2212\", 2), \"pos_rx\": (\"O2 + 2H2O + 4e\u2212 \u2192 4OH\u2212\", 4),\n              \"cation\": \"K+\", \"anion\": \"OH\u2212\", \"rechargeable\": False},\n}\n\n\ndef path(cell, mode=\"discharge\"):\n    \"\"\"Which electrode is the anode, and where electrons and ions go.\"\"\"\n    c = CELLS[cell]\n    if mode == \"discharge\":\n        anode, cathode, sign = c[\"neg\"], c[\"pos\"], \"negative\"\n    else:                                    # charge: a power supply reverses both reactions\n        anode, cathode, sign = c[\"pos\"], c[\"neg\"], \"positive\"\n    return {\"cell\": cell, \"mode\": mode, \"anode\": anode, \"cathode\": cathode, \"anode_sign\": sign,\n            \"e_from\": anode, \"e_to\": cathode, \"cation_to\": cathode, \"anion_to\": anode,\n            \"supply\": mode == \"charge\"}\n\n\ndef combine_znair():\n    \"\"\"Electrons lost by Zn equal electrons gained by O2.\"\"\"\n    z_ox, z_red = CELLS[\"znair\"][\"neg_rx\"][1], CELLS[\"znair\"][\"pos_rx\"][1]\n    e = z_ox * z_red // math.gcd(z_ox, z_red)\n    return {\"zn\": e // z_ox, \"o2\": e // z_red, \"e\": e}\n\n\ndef znair_mass(m_zn):\n    \"\"\"2 Zn + O2 -> 2 ZnO, from a mass of Zn.\"\"\"\n    n = m_zn / M[\"Zn\"]\n    return {\"m_zn\": m_zn, \"n_zn\": n, \"m_o2\": n / 2 * M[\"O2\"], \"m_zno\": n * M[\"ZnO\"], \"e_mol\": 2 * n}\n\n\ndef bridge(e_mol):\n    \"\"\"Daniell cell: charge each half-cell would build up without ions moving.\"\"\"\n    return {\"e_mol\": e_mol, \"zn2_added\": e_mol / 2, \"cu2_removed\": e_mol / 2,\n            \"anion_to_zn\": e_mol, \"cation_to_cu\": e_mol}\n\n\ndef co_oxidation():\n    \"\"\"Oxidation number of Co: Li +1, O -2, sum 0.\"\"\"\n    return {\"CoO2\": 0 - 2 * -2, \"LiCoO2\": 0 - 1 - 2 * -2}\n\n\ndef lab_results():\n    return {\"daniell\": path(\"daniell\"), \"li_dis\": path(\"liion\", \"discharge\"), \"li_chg\": path(\"liion\", \"charge\"),\n            \"co\": co_oxidation(), \"znair\": combine_znair(), \"zn1\": znair_mass(1.00)}\n\n\ndef classroom_results():\n    R = {\"meta\": {\"numpy\": __import__(\"numpy\").__version__, \"scipy\": __import__(\"scipy\").__version__, \"python\": sys.version.split()[0]}}\n    R[\"lecture\"] = {\n        \"cells\": CELLS,\n        \"paths\": {f\"{c}_{m}\": path(c, m) for c in CELLS for m in (\"discharge\", \"charge\") if m == \"discharge\" or CELLS[c][\"rechargeable\"]},\n        \"bridge\": bridge(0.0200), \"co\": co_oxidation(), \"znair\": combine_znair(),\n        \"zn_table\": [znair_mass(m / 2) for m in range(1, 11)], \"molar\": M,\n        \"e_daniell_preview\": 1.10,          # V, computed in Class 9\n    }\n    R[\"lab\"] = lab_results()\n    return R\n\n\nif __name__ == \"__main__\":\n    R = classroom_results()\n    if \"--json\" in sys.argv:\n        with open(\"cell-results.json\", \"w\") as fh:\n            json.dump(R, fh, indent=1, ensure_ascii=False)\n        print(\"wrote cell-results.json\"); sys.exit()\n    for k, p in R[\"lecture\"][\"paths\"].items():\n        print(\"%-16s anode %-9s (%s)  e- %s -> %s  cations -> %s\" % (k, p[\"anode\"], p[\"anode_sign\"], p[\"e_from\"], p[\"e_to\"], p[\"cation_to\"]))\n    print(\"bridge:\", R[\"lecture\"][\"bridge\"])\n    print(\"Co:\", R[\"lecture\"][\"co\"], \" zinc-air:\", R[\"lecture\"][\"znair\"])\n    z = R[\"lab\"][\"zn1\"]; print(\"1.00 g Zn: O2 %.4f g, ZnO %.4f g, e- %.5f mol\" % (z[\"m_o2\"], z[\"m_zno\"], z[\"e_mol\"]))\n";   // embedded copy, so live Python also works when the file is opened locally

function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v||1)));for(const m of [1,1.2,1.5,2,2.5,3,4,5,6,8,10]){if(m*p>=v)return m*p}return 10*p}
function axes(o){ // o: w,h,l,r,t,b,ymin,ymax,xlabels,ylab,ticks

  for(let k=0;k<=n;k++){const v=ymin+(ymax-ymin)*k/n, y=t+Y-(v-ymin)/(ymax-ymin)*Y;
    s+=`<line x1="${l}" x2="${w-r}" y1="${y}" y2="${y}" stroke="${C.mist}" stroke-width="0.8" opacity=".7"/><text x="${l-8}" y="${y+5}" font-size="16" text-anchor="end" fill="${C.ink}">${fmt(v, (o.step||1)<1?1:0)}</text>`}
  s+=`<line x1="${l}" x2="${l}" y1="${t}" y2="${t+Y}" stroke="${C.graphite}" stroke-width="1.5"/>`;
  const z=t+Y-(0-ymin)/(ymax-ymin)*Y; s+=`<line x1="${l}" x2="${w-r}" y1="${Math.min(t+Y,Math.max(t,z))}" y2="${Math.min(t+Y,Math.max(t,z))}" stroke="${C.graphite}" stroke-width="1.5"/>`;
  if(o.ylab)s+=`<text transform="translate(${16},${t+Y/2}) rotate(-90)" font-size="17" text-anchor="middle" fill="${C.ink}">${o.ylab}</text>`;

/* Food Manufacture: stacked bars of a [month][oil] matrix, optional line */
function hbar(items,opt={}){ // items: {t,v,c}
  const w=opt.w||640,h=opt.h||330,l=opt.l||250,r=90,t=16,rowh=(h-t-20)/items.length;

/* the outer circuit: a bulb in discharge, a power supply in charge */
function circuit(xl, xr, ytop, y0, p){let s = `<polyline points="${xl},${y0} ${xl},${ytop} ${xr},${ytop} ${xr},${y0}" fill="none" stroke="${C.graphite}" stroke-width="2.5"/>`; const xm = (xl + xr) / 2;
 if (p && p.supply) s += `<rect x="${xm - 34}" y="${ytop - 18}" width="68" height="36" rx="5" fill="#fff" stroke="${C.graphite}" stroke-width="2"/>` + T(xm, ytop + 5, "supply", C.ink, 13);
 else s += `<circle cx="${xm}" cy="${ytop}" r="16" fill="${p ? "#fbe7c4" : "#fff"}" stroke="${C.graphite}" stroke-width="2"/>` + T(xm, ytop + 5, "bulb", C.ink, 10);
 return s}
function eArrows(p, xl, xr, ytop){if (!p) return ""; const ltr = p.e_from === p.left; const a = ltr ? [xl + 30, xl + 110] : [xr - 30, xr - 110], b = ltr ? [xr - 110, xr - 30] : [xl + 110, xl + 30];
 return arrow(a[0], ytop - 14, a[1], ytop - 14, C.amber) + arrow(b[0], ytop - 14, b[1], ytop - 14, C.amber) + T((xl + xr) / 2, ytop - 30, `electrons (e⁻) ${ltr ? "→" : "←"}`, C.amber, 14)}

function daniellSVG(bridgeOn){const w = 520, h = 330, P = bridgeOn ? Object.assign({left: "Zn"}, LC().paths.daniell_discharge) : null; let s = svgEl(w, h);
 s += `<path d="M40 150 L40 300 L210 300 L210 150 M310 150 L310 300 L480 300 L480 150" fill="none" stroke="${C.graphite}" stroke-width="2.5"/>`;
 s += `<rect x="42" y="180" width="166" height="118" fill="${C.mist}" opacity=".35"/><rect x="312" y="180" width="166" height="118" fill="${C.sky}" opacity=".45"/>`;
 s += `<rect x="85" y="110" width="26" height="160" fill="#a9b3ba" stroke="${C.graphite}"/><rect x="409" y="110" width="26" height="160" fill="${C.rust}" stroke="${C.graphite}"/>`;
 s += T(98, 290, "Zn"); s += T(422, 290, "Cu", "#fff"); s += T(138, 262, "Zn²⁺", C.ink, 13); s += T(380, 262, "Cu²⁺", C.ink, 13);
 s += circuit(98, 422, 60, 110, P) + eArrows(P, 98, 422, 60);
 if (bridgeOn){s += `<path d="M175 250 L175 135 L345 135 L345 250" fill="none" stroke="${C.sand}" stroke-width="22"/>` + T(260, 125, "salt bridge (KNO₃)", C.ink, 13);
  s += arrow(290, 158, 230, 158, C.plum) + T(260, 178, "NO₃⁻ → Zn side", C.plum, 13) + arrow(230, 196, 290, 196, C.teal) + T(260, 216, "K⁺ → Cu side", C.teal, 13)}
 else s += T(260, 150, "no salt bridge: no current", C.rust, 15);
 s += T(125, 322, "anode (−): Zn → Zn²⁺ + 2e⁻", C.ink, 13) + T(395, 322, "cathode (+): Cu²⁺ + 2e⁻ → Cu", C.ink, 13);
 return s + "</svg>"}

function batterySVG(cell, mode){const w = 520, h = 330, c = LC().cells[cell], p = Object.assign({left: c.neg}, LC().paths[`${cell}_${mode}`]); let s = svgEl(w, h);
 s += `<rect x="60" y="130" width="400" height="160" fill="#fff" stroke="${C.graphite}" stroke-width="2"/><rect x="62" y="132" width="396" height="156" fill="${C.sand}" opacity=".35"/>`;
 s += `<rect x="62" y="132" width="90" height="156" fill="${C.graphite}" opacity=".8"/><rect x="368" y="132" width="90" height="156" fill="${cell === "znair" ? "#fff" : C.sky}" opacity=".9" stroke="${C.graphite}"/>`;
 s += `<line x1="260" x2="260" y1="132" y2="288" stroke="${C.slate}" stroke-dasharray="5 4"/>` + T(260, 304, "separator", C.slate, 12);
 s += T(107, 215, c.neg === "graphite" ? "graphite" : "Zn", "#fff", 14) + T(413, 215, cell === "znair" ? "air (O₂)" : "LiCoO₂", C.ink, 14);
 s += circuit(107, 413, 60, 130, p) + eArrows(p, 107, 413, 60);
 const toRight = p.cation_to === c.pos, ion = cell === "znair" ? "OH⁻" : "Li⁺", col = cell === "znair" ? C.plum : C.teal, rightward = cell === "znair" ? !toRight : toRight;
 for (let k = 0; k < 3; k++){const y = 165 + k * 45; s += rightward ? arrow(180, y, 340, y, col) : arrow(340, y, 180, y, col)}
 s += T(260, 155, `${ion} ${rightward ? "→" : "←"}`, col, 15);
 s += T(107, 322, `${p.anode === c.neg ? "anode" : "cathode"} (−)`, C.ink, 13) + T(413, 322, `${p.anode === c.pos ? "anode" : "cathode"} (+)`, C.ink, 13);
 return s + "</svg>"}

/* ---------- class illustrations ---------- */
function heroCell(){let s = A3.battery(150, 120, 75, 230, "Li-ion") + A3X.wire([[150, 110], [150, 50], [360, 50], [360, 330], [150, 330], [150, 352]]) + A3X.bulb(360, 190);
 [220, 290].forEach(x => s += A3.eBall(x, 50, 11)); s += A3.eBall(360, 110, 11) + A3.eBall(260, 330, 11);
 return A3.svg(460, 420, s + A3.txt(230, 400, "electrons through the wire, ions inside the cell", "#1C242B", 17, "middle", 700))}
function picDaniell(){return A3.svg(440, 280, A3X.daniell(10, 0))}
function picTwoCells(){let s = A3X.daniell(0, 10, {labels: false}) + A3X.daniell(440, 10, {mid: "supply", labels: false});
 s += A3.txt(210, 290, "galvanic: the reaction drives the current", "#0F6E6B", 17, "middle", 700) + A3.txt(650, 290, "electrolytic: a supply drives it", "#B7791F", 17, "middle", 700);
 return A3.svg(880, 300, s)}

 const au=document.getElementById("narr"),bar=document.getElementById("nbar"),cap=document.getElementById("cap"),play=document.getElementById("nPlay"),tm=document.getElementById("nTime"),msg=document.getElementById("nMsg");
 document.getElementById("dock").style.display="flex";document.getElementById("help").style.display="none";let on=false,lang="off",slideIdx=-1;
 const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
 lang=ls("cc-lang")||"off";if(lang!=="en")lang="off";const sp=ls("narr-speed");if(sp)document.getElementById("nSpeed").value=sp;
 const fmtT=t=>isFinite(t)?`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,"0")}`:"0:00";
 const S_=i=>NARR.slides[i];
 function load(i){slideIdx=i;const s=S_(i);if(!s){au.removeAttribute("src");return}au.src=s.file;au.playbackRate=+document.getElementById("nSpeed").value;tm.textContent=`0:00 / ${fmtT(s.duration)}`;showCap(0)}
 function setPlayUI(){play.textContent=au.paused?"▶ Play":"❚❚ Pause";play.classList.toggle("on",!au.paused)}
 // captions sit in their own band under the slide; long lines shrink to fit the band
 window.capRefit=()=>{let f=parseFloat(cap.dataset.fs)||18;cap.style.fontSize=f+"px";while(cap.scrollHeight>cap.clientHeight+1&&f>11){f-=1;cap.style.fontSize=f+"px"}};
 function showCap(t){const s=S_(slideIdx);let c=null;if(s&&lang!=="off"){for(const q of s.cues){if(t>=q.s-0.05)c=q;else break}}
  const txt=(!c||(au.paused&&au.currentTime===0&&!on))?"":c.en;if(cap.textContent!==txt){cap.textContent=txt;capRefit()}}

 window.ccCycle=()=>{lang=lang==="off"?"en":"off";ls("cc-lang",lang);ccUI()};

 ccUI();setTimeout(()=>{if(slideIdx<0)load(cur)},0);
})();
