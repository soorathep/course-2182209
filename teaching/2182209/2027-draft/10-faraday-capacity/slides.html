const RECORDED = {"meta":{"numpy":"2.2.5","scipy":"1.14.1","python":"3.13.18"},"lecture":{"F":96485.33212,"M":{"Cu":63.546,"Zn":65.38,"C6":72.066,"LiCoO2":97.87100000000001},"rho":8.96,"wafer_area":706.8583470577034,"t_1um_10mA":272.089061717559,"I_wafer_10mA":7.0685834705770345,"caps":[{"m":"graphite (LiC6)","z":1,"M":72.066,"q":371.901883612861},{"m":"LiCoO2","z":1,"M":97.87100000000001,"q":273.84497087435955},{"m":"Zn","z":2,"M":65.38,"q":819.8678845042657}],"phones":[{"name":"A","mAh":3000,"V":3.2,"Wh":9.600000000000001},{"name":"B","mAh":2800,"V":3.7,"Wh":10.36}],"pb_limit_Wh":100.0,"gauge":{"cap_Ah":3.0,"I_A":0.3,"hours":10.0,"used_Ah_after_4h":1.2,"soc_after_4h":0.6000000000000001}},"lab":{"base":{"I":0.1,"t":600,"eff":0.9,"area":10.0,"Q":60.0,"n_e":0.0006218561793970638,"n_m":0.0002798352807286787,"m_mg":17.78241274918462,"h_um":1.9846442800429258},"area20":{"I":0.1,"t":600,"eff":0.9,"area":20.0,"Q":60.0,"n_e":0.0006218561793970638,"n_m":0.0002798352807286787,"m_mg":17.78241274918462,"h_um":0.9923221400214629},"I200":{"I":0.2,"t":600,"eff":0.9,"area":10.0,"Q":120.0,"n_e":0.0012437123587941276,"n_m":0.0005596705614573575,"m_mg":35.56482549836924,"h_um":3.9692885600858516},"eff100":{"I":0.1,"t":600,"eff":1.0,"area":10.0,"Q":60.0,"n_e":0.0006218561793970638,"n_m":0.0003109280896985319,"m_mg":19.758236387982908,"h_um":2.2051603111588065},"C_1Ah":3600.0,"Wh32":3.2,"Wh37":3.7,"q_graphite":371.901883612861,"F":96485.33212}};
const LAB_FILE = "faraday_lab.py?v=c10-69d9549a";
const LAB_SRC = "\"\"\"Class 10 of 2182209 Chemistry for Semiconductor Engineering (2027 draft).\n\nFaraday's law for Cu electroplating, and battery capacity and energy. Every number on the\nClass 10 slides and in Lab 10 comes from this module.\n\nRun `python faraday_lab.py` for a printed summary, or `python faraday_lab.py --json` to\nwrite faraday-results.json.\n\nData: F from CODATA 2018 via scipy.constants; molar masses from IUPAC 2021; density of Cu\n8.96 g/cm3 (CRC Handbook). Current efficiency is the fraction of the charge that goes into\nthe wanted reaction (the rest goes, for example, to H2). Theoretical specific capacity\nq = z F / (3.6 M) in mAh/g, for full use of the stated reaction:\ngraphite LiC6 (1 e- per C6), LiCoO2 (1 e- per LiCoO2, full delithiation), Zn (2 e- per Zn).\n\"\"\"\nimport json\nimport math\nimport sys\n\nimport numpy as np\nfrom scipy import constants as sc\n\nF = sc.physical_constants[\"Faraday constant\"][0]     # C/mol\nM = {\"Cu\": 63.546, \"Zn\": 65.38, \"C6\": 6 * 12.011, \"LiCoO2\": 6.94 + 58.933 + 2 * 15.999}\nRHO_CU = 8.96                                        # g/cm3\n\n\ndef plate(I, t, eff=1.0, area=1.0, z=2, metal=\"Cu\", rho=RHO_CU):\n    \"\"\"Mass (mg) and thickness (um) of metal deposited by current I (A) for time t (s).\"\"\"\n    Q = I * t\n    n_e = Q / F\n    n_m = eff * n_e / z\n    m = n_m * M[metal]                                # g\n    h = m / rho / area * 1e4                          # um\n    return {\"I\": I, \"t\": t, \"eff\": eff, \"area\": area, \"Q\": Q, \"n_e\": n_e, \"n_m\": n_m, \"m_mg\": m * 1e3, \"h_um\": h}\n\n\ndef time_for(h_um, j_mA_cm2, eff=1.0, z=2, metal=\"Cu\", rho=RHO_CU):\n    \"\"\"Time (s) to plate a thickness h at current density j; independent of area.\"\"\"\n    m_per_cm2 = h_um * 1e-4 * rho\n    Q_per_cm2 = m_per_cm2 / M[metal] * z * F / eff\n    return Q_per_cm2 / (j_mA_cm2 * 1e-3)\n\n\ndef energy_Wh(Ah, V):\n    return Ah * V\n\n\ndef spec_capacity(z, molar):\n    \"\"\"Theoretical specific capacity, mAh/g.\"\"\"\n    return z * F / (3.6 * molar)\n\n\ndef lab_results():\n    base = plate(0.100, 600, 0.90, 10.0)\n    return {\"base\": base, \"area20\": plate(0.100, 600, 0.90, 20.0), \"I200\": plate(0.200, 600, 0.90, 10.0),\n            \"eff100\": plate(0.100, 600, 1.0, 10.0), \"C_1Ah\": 3600.0,\n            \"Wh32\": energy_Wh(1.00, 3.2), \"Wh37\": energy_Wh(1.00, 3.7),\n            \"q_graphite\": spec_capacity(1, M[\"C6\"]), \"F\": F}\n\n\ndef classroom_results():\n    R = {\"meta\": {\"numpy\": np.__version__, \"scipy\": __import__(\"scipy\").__version__, \"python\": sys.version.split()[0]}}\n    w300 = math.pi * 15.0 ** 2                       # cm2, 300 mm wafer\n    R[\"lecture\"] = {\n        \"F\": F, \"M\": M, \"rho\": RHO_CU,\n        \"wafer_area\": w300, \"t_1um_10mA\": time_for(1.0, 10.0), \"I_wafer_10mA\": 10e-3 * w300,\n        \"caps\": [{\"m\": \"graphite (LiC6)\", \"z\": 1, \"M\": M[\"C6\"], \"q\": spec_capacity(1, M[\"C6\"])},\n                 {\"m\": \"LiCoO2\", \"z\": 1, \"M\": M[\"LiCoO2\"], \"q\": spec_capacity(1, M[\"LiCoO2\"])},\n                 {\"m\": \"Zn\", \"z\": 2, \"M\": M[\"Zn\"], \"q\": spec_capacity(2, M[\"Zn\"])}],\n        \"phones\": [{\"name\": \"A\", \"mAh\": 3000, \"V\": 3.2, \"Wh\": energy_Wh(3.0, 3.2)}, {\"name\": \"B\", \"mAh\": 2800, \"V\": 3.7, \"Wh\": energy_Wh(2.8, 3.7)}],\n        \"pb_limit_Wh\": 100.0,\n        \"gauge\": {\"cap_Ah\": 3.0, \"I_A\": 0.300, \"hours\": 3.0 / 0.300, \"used_Ah_after_4h\": 0.300 * 4, \"soc_after_4h\": 1 - 0.300 * 4 / 3.0},\n    }\n    R[\"lab\"] = lab_results()\n    return R\n\n\nif __name__ == \"__main__\":\n    R = classroom_results()\n    if \"--json\" in sys.argv:\n        with open(\"faraday-results.json\", \"w\") as fh:\n            json.dump(R, fh, indent=1)\n        print(\"wrote faraday-results.json\"); sys.exit()\n    L = R[\"lab\"]; b = L[\"base\"]\n    print(\"Q = %.1f C, n(e) = %.4e mol, n(Cu) = %.4e mol, m = %.2f mg, h = %.3f um\" % (b[\"Q\"], b[\"n_e\"], b[\"n_m\"], b[\"m_mg\"], b[\"h_um\"]))\n    for k in (\"area20\", \"I200\", \"eff100\"):\n        print(k, \"m = %.2f mg, h = %.3f um\" % (L[k][\"m_mg\"], L[k][\"h_um\"]))\n    print(\"1.00 Ah = %.0f C; %.1f Wh at 3.2 V; %.1f Wh at 3.7 V\" % (L[\"C_1Ah\"], L[\"Wh32\"], L[\"Wh37\"]))\n    Lc = R[\"lecture\"]\n    print(\"300 mm wafer %.1f cm2, current at 10 mA/cm2 %.2f A, 1 um takes %.0f s\" % (Lc[\"wafer_area\"], Lc[\"I_wafer_10mA\"], Lc[\"t_1um_10mA\"]))\n    for c in Lc[\"caps\"]:\n        print(\"%-16s %.0f mAh/g\" % (c[\"m\"], c[\"q\"]))\n    for p in Lc[\"phones\"]:\n        print(p)\n";   // embedded copy, so live Python also works when the file is opened locally
let R = RECORDED, MODE = "recorded";
const C = {teal:"#0F6E6B",amber:"#E29A2D",rust:"#BE654C",sky:"#5A91BE",sage:"#83A462",plum:"#995A90",graphite:"#333F4A",sand:"#DFC98F",ink:"#1C242B",slate:"#66727C",mist:"#B9C1C6",paper:"#F3F0EB"};
const fmt = (x,d=0)=>x==null?"–":Number(x).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});

/* ---------- tiny SVG chart helpers ---------- */
function svgEl(w,h){return `<svg class="ch" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" font-family="Helvetica Neue,Arial,sans-serif">`}
function niceStep(r,n=5){const raw=r/n,p=Math.pow(10,Math.floor(Math.log10(raw||1)));for(const m of [1,2,2.5,5,10]){if(m*p>=raw-1e-12)return m*p}return 10*p}
function scale(o,lo,hi){const st=niceStep(hi-lo);o.step=st;o.ymin=Math.floor(lo/st+1e-9)*st;o.ymax=Math.ceil(hi/st-1e-9)*st;o.ticks=Math.round((o.ymax-o.ymin)/st);return o}
function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v||1)));for(const m of [1,1.2,1.5,2,2.5,3,4,5,6,8,10]){if(m*p>=v)return m*p}return 10*p}
function axes(o){ // o: w,h,l,r,t,b,ymin,ymax,xlabels,ylab,ticks
  const {w,h,l,r,t,b,ymin,ymax}=o, X=w-l-r, Y=h-t-b, n=o.ticks||5; let s="";
  for(let k=0;k<=n;k++){const v=ymin+(ymax-ymin)*k/n, y=t+Y-(v-ymin)/(ymax-ymin)*Y;
    s+=`<line x1="${l}" x2="${w-r}" y1="${y}" y2="${y}" stroke="${C.mist}" stroke-width="0.8" opacity=".7"/><text x="${l-8}" y="${y+5}" font-size="16" text-anchor="end" fill="${C.ink}">${fmt(v, (o.step||1)<1?1:0)}</text>`}
  s+=`<line x1="${l}" x2="${l}" y1="${t}" y2="${t+Y}" stroke="${C.graphite}" stroke-width="1.5"/>`;
  const z=t+Y-(0-ymin)/(ymax-ymin)*Y; s+=`<line x1="${l}" x2="${w-r}" y1="${Math.min(t+Y,Math.max(t,z))}" y2="${Math.min(t+Y,Math.max(t,z))}" stroke="${C.graphite}" stroke-width="1.5"/>`;
  if(o.ylab)s+=`<text transform="translate(${16},${t+Y/2}) rotate(-90)" font-size="17" text-anchor="middle" fill="${C.ink}">${o.ylab}</text>`;
  return s}
function ymap(o,v){const Y=o.h-o.t-o.b;return o.t+Y-(v-o.ymin)/(o.ymax-o.ymin)*Y}
function legend(items,x,y){let s="";items.forEach((it,i)=>{const yy=y+i*22;s+=it.line?`<line x1="${x}" x2="${x+22}" y1="${yy}" y2="${yy}" stroke="${it.c}" stroke-width="3" ${it.dash?'stroke-dasharray="6 4"':''}/>`:`<rect x="${x}" y="${yy-8}" width="16" height="16" fill="${it.c}" ${it.op?`opacity="${it.op}"`:''}/>`;s+=`<text x="${x+28}" y="${yy+5}" font-size="16" fill="${C.ink}">${it.t}</text>`});return s}
function legendRow(items,x,y){let s="",xx=x;items.forEach(it=>{s+=it.line?`<line x1="${xx}" x2="${xx+20}" y1="${y}" y2="${y}" stroke="${it.c}" stroke-width="3" ${it.dash?'stroke-dasharray="6 4"':''}/>`:`<rect x="${xx}" y="${y-7}" width="14" height="14" fill="${it.c}" ${it.op?`opacity="${it.op}"`:''}/>`;s+=`<text x="${xx+26}" y="${y+5}" font-size="16" fill="${C.ink}">${it.t}</text>`;xx+=38+it.t.length*8.2});return s}

/* Food Manufacture: stacked bars of a [month][oil] matrix, optional line */
function hbar(items,opt={}){ // items: {t,v,c}
  const w=opt.w||640,h=opt.h||330,l=opt.l||250,r=90,t=16,rowh=(h-t-20)/items.length;

/* ---------- Part 1 ---------- */
S.push({kicker:"Part 1 · Faraday’s law", title:"From current to thickness in five steps", html:()=>{const b = R.lab.base; return `<div class="body"><div class="col w55"><table class="t" style="font-size:18px">
<tr><th>Step</th><th>Formula</th><th class="n">0.100 A, 600 s, 90%, 10.0 cm²</th></tr>
<tr><td>1 Charge</td><td>Q = I t</td><td class="n">${b.Q.toFixed(1)} C</td></tr>
<tr><td>2 Electrons</td><td>n(e<sup>−</sup>) = Q / F</td><td class="n">${sci(b.n_e)} mol</td></tr>
<tr><td>3 Cu</td><td>n(Cu) = ε n(e<sup>−</sup>) / 2</td><td class="n">${sci(b.n_m)} mol</td></tr>
<tr><td>4 Mass</td><td>m = n M</td><td class="n"><b>${b.m_mg.toFixed(2)} mg</b></td></tr>
<tr><td>5 Thickness</td><td>h = m / (ρ A)</td><td class="n"><b style="color:${C.amber}">${b.h_um.toFixed(3)} µm</b></td></tr></table></div>
<div class="col"><ul class="b sm"><li>ε, the current efficiency: the fraction of the charge that plates Cu</li><li>z = 2 because each Cu<sup>2+</sup> takes 2 electrons</li><li>Thickness also needs the area the Cu spreads over and the density of Cu</li></ul></div></div>`}});

S.push({kicker:"Part 1 · Demo", title:"A plating calculator", html:()=>`<div class="body"><div class="col w55">
<div class="ctrl"><span style="width:110px">Current, A</span><input type="range" id="pI" min="0.05" max="0.40" step="0.05" value="0.10"><b id="pIv"></b></div>
<div class="ctrl"><span style="width:110px">Time, s</span><input type="range" id="pT" min="300" max="1800" step="300" value="600"><b id="pTv"></b></div>
<div class="ctrl"><span style="width:110px">Efficiency</span><input type="range" id="pE" min="0.70" max="1.00" step="0.05" value="0.90"><b id="pEv"></b></div>
<div class="ctrl"><span style="width:110px">Area, cm²</span><input type="range" id="pA" min="5" max="40" step="5" value="10"><b id="pAv"></b></div>
<div class="kpi" style="margin-top:14px"><div>Q, C<b id="kQ"></b></div><div>Cu, mg<b id="kM"></b></div><div>Thickness, µm<b class="a" id="kH"></b></div></div></div>
<div class="col"><ul class="b sm"><li>Double the current or the time: double the mass and the thickness</li><li>Double the area at the same current: the same mass, half the thickness</li>
<li>Lower efficiency: part of the charge does something else, usually making H<sub>2</sub> at the cathode, so less Cu forms</li></ul></div></div>`,
draw:()=>{const ids = ["pI", "pT", "pE", "pA"]; const go = () => {const [I, t, e, A] = ids.map(i => +document.getElementById(i).value), p = plate(I, t, e, A);
 document.getElementById("pIv").textContent = I.toFixed(2); document.getElementById("pTv").textContent = t; document.getElementById("pEv").textContent = Math.round(e * 100) + "%"; document.getElementById("pAv").textContent = A;
 document.getElementById("kQ").textContent = p.Q.toFixed(1); document.getElementById("kM").textContent = p.m_mg.toFixed(2); document.getElementById("kH").textContent = p.h_um.toFixed(3)};
 ids.forEach(i => document.getElementById(i).oninput = go); go()},
py:{title:"Cu plated by 0.100 A for 600 s", sub:"faraday_lab.plate(0.100, 600, 0.90, 10.0)", code:
`from faraday_lab import plate
p = plate(0.100, 600, eff=0.90, area=10.0)
print("Q = %.1f C" % p["Q"])
print("n(e-) = %.4e mol, n(Cu) = %.4e mol" % (p["n_e"], p["n_m"]))
print("m = %.2f mg, h = %.3f um" % (p["m_mg"], p["h_um"]))`,
out:()=>{const b = R.lab.base; return `Q = ${b.Q.toFixed(1)} C\nn(e-) = ${pye(b.n_e)} mol, n(Cu) = ${pye(b.n_m)} mol\nm = ${b.m_mg.toFixed(2)} mg, h = ${b.h_um.toFixed(3)} um`}},
notes:"The JavaScript uses the same formulas and the F, M and density the Python recorded."});

S.push({kicker:"Part 1 · Plating a wafer", title:"Thickness depends on current density and time", html:()=>`<div class="body"><div class="col w55"><div class="panel"><div class="math" style="font-size:20px;line-height:1.8">
300 mm wafer: A = π (15.0 cm)² = ${LC().wafer_area.toFixed(1)} cm²<br>At 10 mA/cm²: I = ${LC().I_wafer_10mA.toFixed(2)} A<br>
Time for 1.0 µm of Cu (ε = 100%): <b style="color:${C.amber}">${LC().t_1um_10mA.toFixed(0)} s</b>, about ${(LC().t_1um_10mA / 60).toFixed(1)} min</div></div>
<p class="note">Current density j = I/A, in mA/cm². With h = m/(ρA) and m ∝ I t, the area cancels: h depends only on j and t.</p></div>
<div class="col"><ul class="b sm"><li>A small coupon and a full wafer at the same current density and time get the same thickness</li><li>This is why plating recipes are written in mA/cm², not in A</li>
<li>Real Cu plating for interconnects fills narrow trenches, and additives in the bath control where the Cu grows; the charge balance is still Faraday’s law</li></ul>${ART(picSame(), 210)}</div></div>`,
notes:"Order of magnitude only; real recipes vary the current density during the fill."});

Capacity: 1 Ah = 1 A × 3600 s = <b>${R.lab.C_1Ah.toFixed(0)} C</b><br>Energy: Wh = Ah × V</div></div>
<div class="ctrl" style="margin-top:14px"><span>Capacity, Ah</span><input type="range" id="cA" min="0.5" max="5" step="0.5" value="1"><b id="cAv"></b></div>

S.push({kicker:"Part 2 · Demo", title:"How much charge a gram of electrode can hold", html:()=>`<div class="body"><div class="col w55"><div class="panel"><div class="math" style="font-size:21px;line-height:1.8">
q = z F / (3.6 M) &nbsp;&nbsp;in mAh/g</div><div style="font-size:16px;color:${C.slate}">z: electrons per formula unit; M: molar mass in g/mol; 3.6 converts C/g to mAh/g</div></div>
<table class="t" style="font-size:18px;margin-top:12px"><tr><th>Material</th><th class="n">z</th><th class="n">M, g/mol</th><th class="n">q, mAh/g</th></tr>
${LC().caps.map(c => `<tr><td>${c.m.replace("LiC6", "LiC<sub>6</sub>").replace("LiCoO2", "LiCoO<sub>2</sub>")}</td><td class="n">${c.z}</td><td class="n">${c.M.toFixed(2)}</td><td class="n"><b>${c.q.toFixed(0)}</b></td></tr>`).join("")}</table></div>
<div class="col"><ul class="b sm"><li>Graphite: 1 Li per 6 C gives the well-known 372 mAh/g</li><li>LiCoO<sub>2</sub>: 274 mAh/g if all the Li could leave; real cells use about half, to keep the oxide stable</li>
<li>Zn gives 2 electrons and is fairly light, so it stores much more charge per gram: one reason zinc batteries are studied</li></ul></div></div>`,
py:{title:"Theoretical specific capacity", sub:"faraday_lab.spec_capacity(z, M)", code:
`from faraday_lab import spec_capacity, M
for name, z, molar in (("graphite (LiC6)", 1, M["C6"]),
                       ("LiCoO2", 1, M["LiCoO2"]), ("Zn", 2, M["Zn"])):
    print("%-16s %.0f mAh/g" % (name, spec_capacity(z, molar)))`,
out:()=>LC().caps.map(c => `${c.m.padEnd(16)} ${c.q.toFixed(0)} mAh/g`).join("\n")},
notes:"Per gram of the electrode material alone; a whole cell, with electrolyte, current collectors and case, stores much less."});
