const LAB_FILE = "solutions_lab.py?v=c04-0fb0f451";
const LAB_SRC = "\"\"\"Class 4 of 2182209 Chemistry for Semiconductor Engineering (2027 draft).\n\nSolutions, concentration and electrolytes: the CuSO4 bath used to plate copper wiring.\nEvery number on the Class 4 slides and in Lab 4 comes from this module.\n\nRun `python solutions_lab.py` for a printed summary, or `python solutions_lab.py --json`\nto write solutions-results.json.\n\nData: atomic masses as in Class 3; the dilution cases are the exercise data of the 2026\npack (synthetic, no solute lost). Ultrapure water at 25 C: 18.18 Mohm cm (theoretical,\nfrom the self-ionization of water). NumPy only, so it also runs in the browser.\n\"\"\"\nimport json\nimport sys\n\nimport numpy as np\n\nM_AT = {\"Cu\": 63.546, \"S\": 32.06, \"O\": 15.9994, \"H\": 1.008, \"Cl\": 35.45, \"Na\": 22.990, \"C\": 12.011}\n\n\ndef r6(x):\n    if isinstance(x, (list, tuple)):\n        return [r6(v) for v in x]\n    v = round(float(x), 6)\n    return 0.0 if v == 0 else v\n\n\ndef molar_mass(formula):\n    return sum(M_AT[el] * n for el, n in formula.items())\n\n\nM_CUSO4 = molar_mass({\"Cu\": 1, \"S\": 1, \"O\": 4})\nM_H2O = molar_mass({\"H\": 2, \"O\": 1})\nM_HYDRATE = M_CUSO4 + 5 * M_H2O          # CuSO4.5H2O, the blue crystals that are weighed\n\nCASES = [(\"A\", 0.100, 20.0), (\"B\", 0.0500, 40.0), (\"C\", 0.0200, 100.0)]   # C in mol/L, V in mL\n\n\ndef amount(C, V_mL):\n    \"\"\"n = C V, with V converted to L.\"\"\"\n    return C * V_mL / 1000\n\n\ndef dilution_volume(C_stock, C_target, V_target_mL):\n    \"\"\"Volume of stock for C1 V1 = C2 V2.\"\"\"\n    return C_target * V_target_mL / C_stock\n\n\ndef hydrate_mass(C, V_mL):\n    \"\"\"Mass of CuSO4.5H2O to make V_mL of C mol/L CuSO4.\"\"\"\n    return amount(C, V_mL) * M_HYDRATE\n\n\ndef ions(C_salt, cation=(\"Cu2+\", 2, 1), anion=(\"SO4 2-\", -2, 1)):\n    \"\"\"Ion concentrations from a salt that dissociates completely, with a charge check.\"\"\"\n    (cn, cq, cnu), (an, aq, anu) = cation, anion\n    c_cat, c_an = cnu * C_salt, anu * C_salt\n    return {\"cation\": cn, \"anion\": an, \"c_cat\": c_cat, \"c_an\": c_an, \"c_total\": c_cat + c_an,\n            \"charge\": cq * c_cat + aq * c_an}\n\n\ndef mgL_to_molL(mg_per_L, M):\n    return mg_per_L * 1e-3 / M\n\n\ndef lab_results():\n    return {\n        \"cases\": [{\"case\": k, \"C\": C, \"V_mL\": V, \"n\": amount(C, V)} for k, C, V in CASES],\n        \"V_stock\": dilution_volume(0.100, 0.0250, 80.0),\n        \"M_hydrate\": M_HYDRATE,\n        \"m_250mL_0p1\": hydrate_mass(0.100, 250.0),\n        \"m_500mL_0p2\": hydrate_mass(0.200, 500.0),\n        \"ions_0p1\": ions(0.100),\n        \"cl_50\": mgL_to_molL(50.0, M_AT[\"Cl\"]),\n    }\n\n\ndef classroom_results():\n    R = {\"meta\": {\"numpy\": np.__version__, \"scipy\": __import__(\"scipy\").__version__, \"python\": sys.version.split()[0]}}\n    R[\"lecture\"] = {\n        \"M_CuSO4\": M_CUSO4, \"M_H2O\": M_H2O, \"M_hydrate\": M_HYDRATE,\n        \"cases\": [{\"case\": k, \"C\": C, \"V_mL\": V, \"n\": amount(C, V)} for k, C, V in CASES],\n        \"V_stock\": dilution_volume(0.100, 0.0250, 80.0),\n        \"m_1L_0p25\": hydrate_mass(0.250, 1000.0),\n        \"ions\": [ions(0.100), ions(0.100, (\"Na+\", 1, 1), (\"Cl-\", -1, 1)), ions(0.100, (\"Na+\", 1, 2), (\"SO4 2-\", -2, 1))],\n        \"cl_50\": mgL_to_molL(50.0, M_AT[\"Cl\"]),\n        \"upw_Mohm_cm\": 18.18,\n    }\n    R[\"lab\"] = lab_results()\n    return R\n\n\nif __name__ == \"__main__\":\n    R = classroom_results()\n    if \"--json\" in sys.argv:\n        with open(\"solutions-results.json\", \"w\") as fh:\n            json.dump(R, fh, indent=1)\n        print(\"wrote solutions-results.json\"); sys.exit()\n    L = R[\"lecture\"]\n    print(\"M(CuSO4) =\", r6(L[\"M_CuSO4\"]), \" M(CuSO4.5H2O) =\", r6(L[\"M_hydrate\"]))\n    for c in L[\"cases\"]:\n        print(c[\"case\"], \"n =\", r6(c[\"n\"]), \"mol\")\n    print(\"stock for 80.0 mL of 0.0250 M:\", r6(L[\"V_stock\"]), \"mL\")\n    print(\"hydrate for 1.00 L of 0.250 M:\", r6(L[\"m_1L_0p25\"]), \"g\")\n    for q in L[\"ions\"]:\n        print(q)\n    print(\"50 mg/L chloride:\", r6(L[\"cl_50\"]), \"mol/L\")\n";   // embedded copy, so live Python also works when the file is opened locally

/* ---------- tiny SVG chart helpers ---------- */
function svgEl(w,h){return `<svg class="ch" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" font-family="Helvetica Neue,Arial,sans-serif">`}
function niceStep(r,n=5){const raw=r/n,p=Math.pow(10,Math.floor(Math.log10(raw||1)));for(const m of [1,2,2.5,5,10]){if(m*p>=raw-1e-12)return m*p}return 10*p}
function scale(o,lo,hi){const st=niceStep(hi-lo);o.step=st;o.ymin=Math.floor(lo/st+1e-9)*st;o.ymax=Math.ceil(hi/st-1e-9)*st;o.ticks=Math.round((o.ymax-o.ymin)/st);return o}
function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v||1)));for(const m of [1,1.2,1.5,2,2.5,3,4,5,6,8,10]){if(m*p>=v)return m*p}return 10*p}
function axes(o){ // o: w,h,l,r,t,b,ymin,ymax,xlabels,ylab,ticks
  const {w,h,l,r,t,b,ymin,ymax}=o, X=w-l-r, Y=h-t-b, n=o.ticks||5; let s="";

    s+=`<line x1="${l}" x2="${w-r}" y1="${y}" y2="${y}" stroke="${C.mist}" stroke-width="0.8" opacity=".7"/><text x="${l-8}" y="${y+5}" font-size="16" text-anchor="end" fill="${C.ink}">${fmt(v, (o.step||1)<1?1:0)}</text>`}

  if(o.ylab)s+=`<text transform="translate(${16},${t+Y/2}) rotate(-90)" font-size="17" text-anchor="middle" fill="${C.ink}">${o.ylab}</text>`;
  return s}
function ymap(o,v){const Y=o.h-o.t-o.b;return o.t+Y-(v-o.ymin)/(o.ymax-o.ymin)*Y}
function legend(items,x,y){let s="";items.forEach((it,i)=>{const yy=y+i*22;s+=it.line?`<line x1="${x}" x2="${x+22}" y1="${yy}" y2="${yy}" stroke="${it.c}" stroke-width="3" ${it.dash?'stroke-dasharray="6 4"':''}/>`:`<rect x="${x}" y="${yy-8}" width="16" height="16" fill="${it.c}" ${it.op?`opacity="${it.op}"`:''}/>`;s+=`<text x="${x+28}" y="${yy+5}" font-size="16" fill="${C.ink}">${it.t}</text>`});return s}
function legendRow(items,x,y){let s="",xx=x;items.forEach(it=>{s+=it.line?`<line x1="${xx}" x2="${xx+20}" y1="${y}" y2="${y}" stroke="${it.c}" stroke-width="3" ${it.dash?'stroke-dasharray="6 4"':''}/>`:`<rect x="${xx}" y="${y-7}" width="14" height="14" fill="${it.c}" ${it.op?`opacity="${it.op}"`:''}/>`;s+=`<text x="${xx+26}" y="${y+5}" font-size="16" fill="${C.ink}">${it.t}</text>`;xx+=38+it.t.length*8.2});return s}

/* Food Manufacture: stacked bars of a [month][oil] matrix, optional line */
function hbar(items,opt={}){ // items: {t,v,c}
  const w=opt.w||640,h=opt.h||330,l=opt.l||250,r=90,t=16,rowh=(h-t-20)/items.length;
  const mx=opt.max||niceMax(Math.max(...items.map(i=>i.v)));let s=svgEl(w,h);
  items.forEach((it,i)=>{const y=t+i*rowh,bw=(w-l-r)*it.v/mx;
    s+=`<text x="${l-12}" y="${y+rowh/2+5}" font-size="16" text-anchor="end" fill="${C.ink}">${it.t}</text><rect x="${l}" y="${y+rowh*0.18}" width="${Math.max(bw,1)}" height="${rowh*0.64}" fill="${it.c}" rx="3"/><text x="${l+bw+8}" y="${y+rowh/2+6}" font-size="17" font-weight="700" fill="${C.ink}">${opt.fmt?opt.fmt(it.v):fmt(it.v)}</text>`});

  return s+"</svg>"}

 const EL = {Si: "#8E9AA3", O: "#5A91BE", H: "#E9E4DA", Cu: "#BE654C", Zn: "#0F6E6B", P: "#995A90", B: "#83A462", Li: "#83A462", Co: "#333F4A", Na: "#995A90", Cl: "#83A462", C: "#55616b", S: "#E2C14D", e: "#E29A2D"};

function beakerSVG(V){const w = 520, h = 340, V0 = 20, wid = 150 + 3.0 * V, hh = 60 + 1.8 * V, x0 = (w - wid) / 2, y0 = h - 40 - hh; let s = svgEl(w, h);
 s += `<rect x="${x0}" y="${y0}" width="${wid}" height="${hh}" fill="#dbe8f2" stroke="${C.graphite}" stroke-width="2" rx="6"/>`;
 const pts = [[.2,.3],[.6,.2],[.35,.7],[.8,.6]]; pts.forEach(([a, b], i) => {s += `<circle cx="${x0 + a * wid}" cy="${y0 + b * hh}" r="13" fill="${C.sky}"/><text x="${x0 + a * wid}" y="${y0 + b * hh + 4}" font-size="11" fill="#fff" text-anchor="middle">Cu²⁺</text>`;
  s += `<circle cx="${x0 + (1 - a) * wid * 0.9 + 10}" cy="${y0 + (1 - b) * hh * 0.85 + 8}" r="15" fill="${C.sage}"/><text x="${x0 + (1 - a) * wid * 0.9 + 10}" y="${y0 + (1 - b) * hh * 0.85 + 12}" font-size="10" fill="#fff" text-anchor="middle">SO₄²⁻</text>`});
 s += `<text x="${w / 2}" y="${h - 14}" font-size="14" text-anchor="middle" fill="${C.slate}">The same 4 Cu²⁺ and 4 SO₄²⁻ in a larger volume (model, not to scale)</text>`; return s + "</svg>"}

 const go = () => {const V = +sl.value; document.getElementById("bvv").textContent = V + " mL"; document.getElementById("bn").textContent = n.toFixed(5); document.getElementById("bc").textContent = (n / (V / 1000)).toFixed(4); document.getElementById("bch").innerHTML = beakerSVG(V)}; sl.oninput = go; go()},

function ionSVG(q){const w = 520, h = 300; let s = svgEl(w, h); const nc = Math.round(q.c_cat / 0.1), na = Math.round(q.c_an / 0.1);
 s += `<rect x="20" y="20" width="480" height="230" rx="10" fill="#dbe8f2" stroke="${C.graphite}"/>`;
 const draw = (n, k, lab, col, r) => {for (let i = 0; i < n * 3; i++){const x = 60 + ((i * 131 + k * 57) % 400), y = 50 + ((i * 71 + k * 97) % 180); s += `<circle cx="${x}" cy="${y}" r="${r}" fill="${col}"/><text x="${x}" y="${y + 4}" font-size="10" fill="#fff" text-anchor="middle">${lab}</text>`}};
 draw(nc, 0, q.cation.replace("2+", "²⁺").replace("+", "⁺"), C.sky, 13); draw(na, 1, q.anion.replace(" 2-", "²⁻").replace("SO4", "SO₄").replace("-", "⁻"), C.sage, 15);
 s += `<text x="20" y="282" font-size="14" fill="${C.slate}">Positive and negative charges add to zero in every drop</text>`; return s + "</svg>"}
S.push({kicker:"Part 2 · Electrolytes", title:"A salt in water becomes free ions", html:()=>`<div class="body"><div class="col w55"><div class="ctrl"><button id="io0" class="on">CuSO₄</button><button id="io1">NaCl</button><button id="io2">Na₂SO₄</button></div>
<div class="panel grow"><div class="chart" id="ioch"></div></div></div>
<div class="col"><div class="panel" style="display:block;font-size:20px;line-height:1.6" id="iot"></div>
<ul class="b xs" style="margin-top:12px"><li>An electrolyte is a substance whose solution conducts because it contains free ions</li><li>Each ion keeps its charge from Class 1: Cu<sup>2+</sup> has 27 electrons in water too</li><li>Charge balance: Σ(charge × concentration) = 0</li></ul></div></div>`,
draw:()=>{const Q = LC().ions; let k = 0; const nm = ["CuSO4", "NaCl", "Na2SO4"];
 const go = () => {const q = Q[k]; [0, 1, 2].forEach(i => document.getElementById("io" + i).classList.toggle("on", i === k)); document.getElementById("ioch").innerHTML = ionSVG(q);
  document.getElementById("iot").innerHTML = `0.100 mol/L ${sub2(nm[k])}(aq)<br>[${ionTxt(q.cation)}] = ${q.c_cat.toFixed(3)} mol/L<br>[${ionTxt(q.anion)}] = ${q.c_an.toFixed(3)} mol/L<br>Total ions: <b>${q.c_total.toFixed(3)} mol/L</b>; net charge ${q.charge.toFixed(1)}`};
 [0, 1, 2].forEach(i => document.getElementById("io" + i).onclick = () => {k = i; go()}); go()},
py:{title:"Ions from 0.100 mol/L salts", sub:"solutions_lab.ions()", code:
`from solutions_lab import ions, r6
for cat, an in [(("Cu2+", 2, 1), ("SO4 2-", -2, 1)), (("Na+", 1, 1), ("Cl-", -1, 1)),
                (("Na+", 1, 2), ("SO4 2-", -2, 1))]:
    q = ions(0.100, cat, an)
    print(q["cation"], r6(q["c_cat"]), q["anion"], r6(q["c_an"]), "total", r6(q["c_total"]), "charge", r6(q["charge"]))`,
out:()=>LC().ions.map(q=>`${q.cation} ${py6(q.c_cat)} ${q.anion} ${py6(q.c_an)} total ${py6(q.c_total)} charge ${py6(q.charge)}`).join("\n")},
notes:"Na2SO4 shows a 2:1 salt: the cation concentration is twice the salt concentration."});

S.push({kicker:"Part 2 · Two kinds of carrier", title:"Electrons in the wire, ions in the bath", html:()=>`<div class="body"><div class="col w55"><table class="t" style="font-size:18px">
<tr><th></th><th>Cu wire</th><th>CuSO<sub>4</sub>(aq) bath</th></tr>
<tr><td>Carrier</td><td>Electrons</td><td>Cu<sup>2+</sup> and SO<sub>4</sub><sup>2−</sup> ions</td></tr>
<tr><td>Moves toward + terminal</td><td>Electrons</td><td>Anions (SO<sub>4</sub><sup>2−</sup>)</td></tr>
<tr><td>Moves toward − terminal</td><td>–</td><td>Cations (Cu<sup>2+</sup>)</td></tr>
<tr><td>Matter carried along</td><td>No</td><td>Yes, the ions themselves</td></tr></table>
<p class="note">In a plating cell, both kinds meet at the electrode surface. Class 7 shows what happens there: Cu<sup>2+</sup> + 2e<sup>−</sup> → Cu.</p></div>
<div class="col"><ul class="b sm"><li>The more free ions, the better a dilute solution conducts</li><li>Pure water has very few ions: H<sub>3</sub>O<sup>+</sup> and OH<sup>−</sup> at about 10<sup>−7</sup> mol/L each (Class 5)</li>
<li>Chip fabs rinse wafers in ultrapure water and check it by its resistivity: ${LC().upw_Mohm_cm} MΩ·cm at 25 °C. Any stray ion lowers it</li></ul>${ART(picCarriers(), 230)}</div></div>`,

S.push({kicker:"Part 2 · A common mistake", title:"“Deeper blue means it conducts better”", html:()=>`<div class="body"><div class="col w55"><div class="act" style="border-color:${C.rust};background:#fbf0ec"><span class="tag" style="background:${C.rust}">THE CLAIM</span>
<div style="font-size:22px;line-height:1.45">“The darker blue solution has a higher conductivity, so its color tells us how well it conducts.”</div></div>
<div class="panel" style="margin-top:16px"><b style="color:${C.teal};font-size:19px">The correction</b><div style="font-size:19px;line-height:1.5;margin-top:4px">
The blue comes from Cu<sup>2+</sup> only. It tracks [Cu<sup>2+</sup>], not all the ions. A colorless NaCl or H<sub>2</sub>SO<sub>4</sub> solution can conduct far better. Conductivity must be measured, with a conductivity meter.</div></div></div>
<div class="col"><ul class="b sm"><li>Color is evidence about one species</li><li>Conduction depends on every ion present, and on how fast each one moves</li><li>A real plating bath is acidic: its H<sup>+</sup> ions carry much of the current</li></ul>${ART(picColor(), 220)}</div></div>`});

  d.innerHTML=(s.kicker&&!s.cls?`<p class="kicker">${s.kicker}</p>`:"")+(s.title?`<h1>${s.title}</h1>`:"")+s.html()+(s.py?`<div class="dhint">D · Python</div>`:"")+`<footer><span>${foot}</span><span>${i+1} / ${N}</span></footer>`;host.appendChild(d)})}

function show(i){cur=Math.max(0,Math.min(N-1,i));document.querySelectorAll(".slide").forEach((el,k)=>el.classList.toggle("on",k===cur));
 history.replaceState(null,"",location.search+"#"+(cur+1));fillDrawer();if(window.onSlideChange)onSlideChange(cur);const n=document.getElementById("notes");n.textContent=S[cur].notes||"No notes for this slide."}
let CAP_ON=false;   // set by the narration player; reserves a caption band under the slide
function fit(){const W=innerWidth,H=innerHeight,vp=document.getElementById("viewport"),dock=document.getElementById("dock"),cap=document.getElementById("cap");
 const hasDock=dock.style.display==="flex",barH=hasDock?document.getElementById("nbar").offsetHeight:0;
 let k=Math.min(W/1280,H/720)*0.98,capH=0,fs=0,dockH=0;
 for(let it=0;it<3;it++){if(hasDock&&CAP_ON){const lines=k<0.6?4:2;fs=Math.max(12,Math.min(22,24*k));capH=Math.ceil(lines*fs*1.45)+4}else capH=0;
  dockH=hasDock?capH+barH+(capH?6:0)+14:0;k=Math.min(W/1280,Math.max(120,H-dockH)/720)*0.98}
 const h=720*k,pad=10,top=Math.max(0,(H-h-dockH)/2);
 vp.style.top=(top-pad)+"px";vp.style.bottom="auto";vp.style.height=(h+2*pad)+"px";
 document.getElementById("stage").style.transform=`scale(${k})`;
 if(hasDock){dock.style.top=(top+h+6)+"px";cap.style.display=CAP_ON?"block":"none";cap.style.width=Math.min(1280*k,W-16)+"px";cap.style.height=capH+"px";cap.dataset.fs=fs;if(window.capRefit)capRefit()}}
function fillDrawer(){const p=S[cur].py,dr=document.getElementById("drawer");
 if(!p){document.getElementById("dTitle").textContent="No Python on this slide";document.getElementById("dSub").textContent="Slides with a 'D · Python' tag have code and output.";document.getElementById("dCode").value="";document.getElementById("dOut").textContent="";return}
 document.getElementById("dTitle").textContent=p.title;document.getElementById("dSub").textContent=p.sub||"";document.getElementById("dCode").value=p.code;
 try{document.getElementById("dOut").textContent=p.out()}catch(e){document.getElementById("dOut").textContent=String(e)}
 const m=document.getElementById("dMode");m.className="pill "+(MODE==="live"?"live":"rec");m.textContent=MODE==="live"?"LIVE RUN":"RECORDED RUN"}

 if(["ArrowRight","PageDown"," "].includes(k)){e.preventDefault();show(cur+1)}else if(["ArrowLeft","PageUp"].includes(k)){e.preventDefault();show(cur-1)}
 else if(k==="Home")show(0);else if(k==="End")show(N-1);else if(k==="d"||k==="D")document.getElementById("drawer").classList.toggle("open");
 else if(k==="f"||k==="F"){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}

/* ---------- live Python (Pyodide) ---------- */
let py=null;
async function ensurePy(msg){if(py)return py;msg.textContent="Loading Python in the browser (first time about 5–10 s) ...";
 if(!window.loadPyodide){await new Promise((ok,bad)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/pyodide/v0.29.3/full/pyodide.js";s.onload=ok;s.onerror=()=>bad(new Error("could not load Pyodide"));document.head.appendChild(s)})}
 const p=await loadPyodide();await p.loadPackage(["numpy","scipy"]);
 const src=LAB_SRC||await (await fetch(LAB_FILE)).text();p.FS.writeFile("solutions_lab.py",src);
 await p.runPythonAsync('import sys\nsys.path.insert(0, ".")\nfrom solutions_lab import *');py=p;return p}
async function runCode(){const msg=document.getElementById("liveMsg"),out=document.getElementById("dOut"),t0=performance.now();
 try{const p=await ensurePy(msg);msg.textContent="Running ...";const buf=[];p.setStdout({batched:s=>buf.push(s)});p.setStderr({batched:s=>buf.push(s)});
  try{await p.runPythonAsync(document.getElementById("dCode").value)}catch(e){buf.push(String(e.message||e).split("\n").slice(-4).join("\n"))}
  out.textContent=buf.join("\n")||"(no output)";const m=document.getElementById("dMode");m.className="pill live";m.textContent="LIVE OUTPUT";
  msg.textContent=`Ran in ${((performance.now()-t0)/1000).toFixed(1)} s in the browser`}
 catch(e){msg.textContent="Python could not start: "+e.message+". The recorded output is still available."}}
async function runLive(){const msg=document.getElementById("liveMsg"),t0=performance.now();
 try{const p=await ensurePy(msg);msg.textContent="Solving every model ...";
  const out=await p.runPythonAsync('import importlib, json\nimport solutions_lab as lab\nimportlib.reload(lab)\njson.dumps(lab.classroom_results())');
  R=JSON.parse(out);MODE="live";drawAll();fillDrawer();msg.textContent=`All slides now show a live run (${((performance.now()-t0)/1000).toFixed(1)} s, SciPy ${R.meta.scipy})`}
 catch(e){msg.textContent="Live run failed: "+e.message+". The recorded run is still shown."}}
document.getElementById("runCode").onclick=runCode;
document.getElementById("runLive").onclick=runLive;
document.getElementById("useRec").onclick=()=>{R=RECORDED;MODE="recorded";drawAll();fillDrawer();document.getElementById("liveMsg").textContent="Showing the recorded run."};

 ]
};
(function(){if(!NARR)return;
 const au=document.getElementById("narr"),bar=document.getElementById("nbar"),cap=document.getElementById("cap"),play=document.getElementById("nPlay"),tm=document.getElementById("nTime"),msg=document.getElementById("nMsg");
 document.getElementById("dock").style.display="flex";document.getElementById("help").style.display="none";let on=false,lang="off",slideIdx=-1;
 const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
 lang=ls("cc-lang")||"off";if(lang!=="en")lang="off";const sp=ls("narr-speed");if(sp)document.getElementById("nSpeed").value=sp;
 const fmtT=t=>isFinite(t)?`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,"0")}`:"0:00";
 const S_=i=>NARR.slides[i];
 function load(i){slideIdx=i;const s=S_(i);if(!s){au.removeAttribute("src");return}au.src=s.file;au.playbackRate=+document.getElementById("nSpeed").value;tm.textContent=`0:00 / ${fmtT(s.duration)}`;showCap(0)}
 function setPlayUI(){play.textContent=au.paused?"▶ Play":"❚❚ Pause";play.classList.toggle("on",!au.paused)}
 // captions sit in their own band under the slide; long lines shrink to fit the band
 window.capRefit=()=>{let f=parseFloat(cap.dataset.fs)||18;cap.style.fontSize=f+"px";while(cap.scrollHeight>cap.clientHeight+1&&f>11){f-=1;cap.style.fontSize=f+"px"}};
 function showCap(t){const s=S_(slideIdx);let c=null;if(s&&lang!=="off"){for(const q of s.cues){if(t>=q.s-0.05)c=q;else break}}
  const txt=(!c||(au.paused&&au.currentTime===0&&!on))?"":c.en;if(cap.textContent!==txt){cap.textContent=txt;capRefit()}}
 function ccUI(){const b=document.getElementById("nCC");b.textContent=lang==="off"?"CC off":"CC on";b.classList.toggle("on",lang!=="off");CAP_ON=lang!=="off";fit();showCap(au.currentTime||0)}
 window.ccCycle=()=>{lang=lang==="off"?"en":"off";ls("cc-lang",lang);ccUI()};
 // "on" means the student is listening: it starts with Play and ends with Pause or Stop.
 // Slides change only when the student moves; the new slide's narration then starts if "on".
 window.narrToggle=()=>{if(au.paused){on=true;if(slideIdx!==cur)load(cur);if(au.ended)au.currentTime=0;msg.textContent="";au.play().catch(()=>{msg.textContent="Press Play again to start audio."})}else{on=false;au.pause()}};
 window.onSlideChange=i=>{au.pause();msg.textContent="";load(i);if(on)au.play().catch(()=>{})};
 document.getElementById("nPlay").onclick=narrToggle;
 document.getElementById("nStop").onclick=()=>{au.pause();au.currentTime=0;on=false;setPlayUI();showCap(0);tm.textContent=`0:00 / ${fmtT((S_(cur)||{}).duration)}`};
 document.getElementById("nCC").onclick=ccCycle;
 document.getElementById("nPrev").onclick=()=>show(cur-1);document.getElementById("nNext").onclick=()=>show(cur+1);
 document.getElementById("nSpeed").onchange=e=>{au.playbackRate=+e.target.value;ls("narr-speed",e.target.value)};
 au.addEventListener("play",setPlayUI);au.addEventListener("pause",setPlayUI);
 au.addEventListener("timeupdate",()=>{tm.textContent=`${fmtT(au.currentTime)} / ${fmtT((S_(slideIdx)||{}).duration)}`;showCap(au.currentTime)});
 au.addEventListener("ended",()=>{setPlayUI();const s=S_(slideIdx);msg.textContent=s&&s.hold?"Activity: do it now, then press Next ›":cur<N-1?"Press Next › or → for the next slide":"End of the session"});
 const q=new URLSearchParams(location.search);
 if(q.get("narrate")==="1"){const ov=document.getElementById("startov");ov.style.display="flex";document.getElementById("startBtn").onclick=()=>{ov.style.display="none";if(lang==="off"){lang="en";ls("cc-lang",lang)}ccUI();on=true;load(cur);au.play().catch(()=>{})}}
 ccUI();setTimeout(()=>{if(slideIdx<0)load(cur)},0);
})();

build();drawAll();fit();show((parseInt(location.hash.slice(1))||1)-1);
</script>
