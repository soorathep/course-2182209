"note\": \"order of magnitude; depends on direction\"},\n    {\"material\": \"Si (pure)\", \"rho\": 2.3e3, \"bonding\": \"covalent network\", \"class\": \"semiconductor\", \"note\": \"intrinsic, 300 K; doping lowers it (Class 6)\"},\n    {\"material\": \"SiO2 (amorphous)\", \"rho\": 1e16, \"bonding\": \"covalent network\", \"class\": \"insulator\", \"note\": \"order of magnitude\"},\n]\n\nCELLS = {  # atoms per cubic unit cell: corners, faces, edges, inside\n    \"Cu\": {\"lattice\": \"face-centered cubic\", \"a_nm\": 0.3615, \"corner\": 8, \"face\": 6, \"inside\": 0},\n    \"W\": {\"lattice\": \"body-centered cubic\", \"a_nm\": 0.3165, \"corner\": 8, \"face\": 0, \"inside\": 1},\n    \"Si\": {\"lattice\": \"diamond cubic\", \"a_nm\": 0.5431, \"corner\": 8, \"face\": 6, \"inside\": 4},\n}\n\nDENSITY = {\"quartz (crystalline SiO2)\": 2.65, \"fused silica (amorphous SiO2)\": 2.20}\n\n\ndef r6(x):\n    if isinstance(x, (list, tuple)):\n        return [r6(v) for v in x]\n    v = round(float(x), 6)\n    return 0.0 if v == 0 else v\n\n\ndef bond_type(a, b):\n    \"\"\"Classify the bond between atoms a and b.\n\n    Two metals: metallic. Otherwise by the electronegativity difference (OpenStax rule of\n    thumb): below 0.4 nonpolar covalent, 0.4 to 1.8 polar covalent, above 1.8 ionic.\n    \"\"\"\n    d = round(abs(EN[a] - EN[b]), 2)\n    if a in METALS and b in METALS:\n        kind = \"metallic\"\n    elif d < 0.4:\n        kind = \"nonpolar covalent\"\n    elif d <= 1.8:\n        kind = \"polar covalent\"\n    else:\n        kind = \"ionic\"\n    return {\"a\": a, \"b\": b, \"dEN\": d, \"kind\": kind}\n\n\nPAIRS = [(\"Cu\", \"Cu\"), (\"Si\", \"Si\"), (\"C\", \"C\"), (\"Si\", \"O\"), (\"Na\", \"Cl\"), (\"Li\", \"F\")]\n\n\ndef orders(r_hi, r_lo):\n    \"\"\"Orders of magnitude between two resistivities: log10 of their ratio.\"\"\"\n    return float(np.log10(r_hi / r_lo))\n\n\ndef line_resistance(rho, L, w, t):\n    \"\"\"R = rho L / A for a rectangular wire (all in SI units).\"\"\"\n    return rho * L / (w * t)\n\n\ndef layer_resistance(rho, t, area):\n    \"\"\"Resistance across an insulating layer of thickness t and area A.\"\"\"\n    return rho * t / area\n\n\ndef atoms_per_cell(name):\n    c = CELLS[name]\n    n = c[\"corner\"] / 8 + c[\"face\"] / 2 + c[\"inside\"]\n    return dict(c, name=name, atoms=n)\n\n\nLINE = {\"L\": 1e-3, \"w\": 100e-9, \"t\": 200e-9}          # a 1 mm wire, 100 nm wide, 200 nm thick\nLAYER = {\"t\": 100e-9, \"area\": 1e-12, \"V\": 1.0}         # 100 nm of SiO2 under a 1 um x 1 um pad, 1 V\n\n\ndef rho_of(name):\n    return next(r[\"rho\"] for r in RHO if r[\"material\"] == name)\n\n\ndef line_table():\n    out = []\n    for name in (\"Cu\", \"Al\", \"W\"):\n        R = line_resistance(rho_of(name), **LINE)\n        out.append({\"material\": name, \"rho\": rho_of(name), \"R\": R, \"vs_Cu\": R / line_resistance(rho_of(\"Cu\"), **LINE)})\n    return out\n\n\ndef leakage():\n    R = layer_resistance(rho_of(\"SiO2 (amorphous)\"), LAYER[\"t\"], LAYER[\"area\"])\n    return {\"R\": R, \"I\": LAYER[\"V\"] / R, **LAYER}\n\n\ndef silica_density():\n    q, f = DENSITY[\"quartz (crystalline SiO2)\"], DENSITY[\"fused silica (amorphous SiO2)\"]\n    return {\"quartz\": q, \"fused\": f, \"percent_lower\": 100 * (q - f) / q}\n\n\ndef lab_results():\n    lt = {r[\"material\"]: r for r in line_table()}\n    return {\n        \"pairs\": {f\"{a}-{b}\": bond_type(a, b) for a, b in [(\"Si\", \"O\"), (\"Na\", \"Cl\"), (\"Cu\", \"Cu\")]},\n        \"rho\": RHO,\n        \"orders_SiO2_Cu\": orders(rho_of(\"SiO2 (amorphous)\"), rho_of(\"Cu\")),\n        \"orders_Si_Cu\": orders(rho_of(\"Si (pure)\"), rho_of(\"Cu\")),\n        \"line\": LINE, \"R_Cu\": lt[\"Cu\"][\"R\"], \"R_Al\": lt[\"Al\"][\"R\"], \"R_W\": lt[\"W\"][\"R\"],\n        \"R_Cu_half_width\": line_resistance(rho_of(\"Cu\"), LINE[\"L\"], LINE[\"w\"] / 2, LINE[\"t\"]),\n        \"cells\": {k: atoms_per_cell(k)[\"atoms\"] for k in CELLS},\n        \"silica\": silica_density(),\n    }\n\n\ndef classroom_results():\n    R = {\"meta\": {\"numpy\": np.__version__, \"scipy\": __import__(\"scipy\").__version__, \"python\": sys.version.split()[0]}}\n    R[\"lecture\"] = {\n        \"EN\": EN, \"metals\": sorted(METALS),\n        \"pairs\": [bond_type(a, b) for a, b in PAIRS],\n        \"rho\": RHO,\n        \"orders_SiO2_Cu\": orders(rho_of(\"SiO2 (amorphous)\"), rho_of(\"Cu\")),\n        \"line\": LINE, \"lines\": line_table(),\n        \"leak\": leakage(),\n        \"cells\": [atoms_per_cell(k) for k in (\"Cu\", \"W\", \"Si\")],\n        \"silica\": silica_density(),\n    }\n    R[\"lab\"] = lab_results()\n    return R\n\n\nif __name__ == \"__main__\":\n    R = classroom_results()\n    if \"--json\" in sys.argv:\n        with open(\"bonding-results.json\", \"w\") as fh:\n            json.dump(R, fh, indent=1)\n        print(\"wrote bonding-results.json\"); sys.exit()\n    L = R[\"lecture\"]\n    for p in L[\"pairs\"]:\n        print(f\"{p['a']}-{p['b']}: dEN {p['dEN']:.2f}, {p['kind']}\")\n    print(\"orders of magnitude, SiO2 vs Cu:\", r6(L[\"orders_SiO2_Cu\"]))\n    for r in L[\"lines\"]:\n        print(f\"1 mm line in {r['material']}: {r6(r['R'])} ohm ({r6(r['vs_Cu'])} x Cu)\")\n    print(\"SiO2 layer:\", L[\"leak\"])\n    for c in L[\"cells\"]:\n        print(c[\"name\"], c[\"lattice\"], \"atoms per cell\", c[\"atoms\"])\n    print(\"silica density:\", L[\"silica\"])\n";   // embedded copy, so live Python also works when the file is opened locally

function svgEl(w,h){return `<svg class="ch" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" font-family="Helvetica Neue,Arial,sans-serif">`}
function niceStep(r,n=5){const raw=r/n,p=Math.pow(10,Math.floor(Math.log10(raw||1)));for(const m of [1,2,2.5,5,10]){if(m*p>=raw-1e-12)return m*p}return 10*p}
function scale(o,lo,hi){const st=niceStep(hi-lo);o.step=st;o.ymin=Math.floor(lo/st+1e-9)*st;o.ymax=Math.ceil(hi/st-1e-9)*st;o.ticks=Math.round((o.ymax-o.ymin)/st);return o}
function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v||1)));for(const m of [1,1.2,1.5,2,2.5,3,4,5,6,8,10]){if(m*p>=v)return m*p}return 10*p}
function axes(o){ // o: w,h,l,r,t,b,ymin,ymax,xlabels,ylab,ticks
  const {w,h,l,r,t,b,ymin,ymax}=o, X=w-l-r, Y=h-t-b, n=o.ticks||5; let s="";
  for(let k=0;k<=n;k++){const v=ymin+(ymax-ymin)*k/n, y=t+Y-(v-ymin)/(ymax-ymin)*Y;
    s+=`<line x1="${l}" x2="${w-r}" y1="${y}" y2="${y}" stroke="${C.mist}" stroke-width="0.8" opacity=".7"/><text x="${l-8}" y="${y+5}" font-size="16" text-anchor="end" fill="${C.ink}">${fmt(v, (o.step||1)<1?1:0)}</text>`}
  s+=`<line x1="${l}" x2="${l}" y1="${t}" y2="${t+Y}" stroke="${C.graphite}" stroke-width="1.5"/>`;
  const z=t+Y-(0-ymin)/(ymax-ymin)*Y; s+=`<line x1="${l}" x2="${w-r}" y1="${Math.min(t+Y,Math.max(t,z))}" y2="${Math.min(t+Y,Math.max(t,z))}" stroke="${C.graphite}" stroke-width="1.5"/>`;
  if(o.ylab)s+=`<text transform="translate(${16},${t+Y/2}) rotate(-90)" font-size="17" text-anchor="middle" fill="${C.ink}">${o.ylab}</text>`;
  return s}
function ymap(o,v){const Y=o.h-o.t-o.b;return o.t+Y-(v-o.ymin)/(o.ymax-o.ymin)*Y}
function legend(items,x,y){let s="";items.forEach((it,i)=>{const yy=y+i*22;s+=it.line?`<line x1="${x}" x2="${x+22}" y1="${yy}" y2="${yy}" stroke="${it.c}" stroke-width="3" ${it.dash?'stroke-dasharray="6 4"':''}/>`:`<rect x="${x}" y="${yy-8}" width="16" height="16" fill="${it.c}" ${it.op?`opacity="${it.op}"`:''}/>`;s+=`<text x="${x+28}" y="${yy+5}" font-size="16" fill="${C.ink}">${it.t}</text>`});return s}
function legendRow(items,x,y){let s="",xx=x;items.forEach(it=>{s+=it.line?`<line x1="${xx}" x2="${xx+20}" y1="${y}" y2="${y}" stroke="${it.c}" stroke-width="3" ${it.dash?'stroke-dasharray="6 4"':''}/>`:`<rect x="${xx}" y="${y-7}" width="14" height="14" fill="${it.c}" ${it.op?`opacity="${it.op}"`:''}/>`;s+=`<text x="${xx+26}" y="${y+5}" font-size="16" fill="${C.ink}">${it.t}</text>`;xx+=38+it.t.length*8.2});return s}

/* Food Manufacture: stacked bars of a [month][oil] matrix, optional line */
function hbar(items,opt={}){ // items: {t,v,c}
  const w=opt.w||640,h=opt.h||330,l=opt.l||250,r=90,t=16,rowh=(h-t-20)/items.length;
  const mx=opt.max||niceMax(Math.max(...items.map(i=>i.v)));let s=svgEl(w,h);
  items.forEach((it,i)=>{const y=t+i*rowh,bw=(w-l-r)*it.v/mx;
    s+=`<text x="${l-12}" y="${y+rowh/2+5}" font-size="16" text-anchor="end" fill="${C.ink}">${it.t}</text><rect x="${l}" y="${y+rowh*0.18}" width="${Math.max(bw,1)}" height="${rowh*0.64}" fill="${it.c}" rx="3"/><text x="${l+bw+8}" y="${y+rowh/2+6}" font-size="17" font-weight="700" fill="${C.ink}">${opt.fmt?opt.fmt(it.v):fmt(it.v)}</text>`});
  s+=`<line x1="${l}" x2="${l}" y1="${t}" y2="${h-20}" stroke="${C.graphite}" stroke-width="1.5"/>`;
  return s+"</svg>"}

const A3 = (() => {

 const svg = (w, h, body) => {ensure(body); return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:100%" preserveAspectRatio="xMidYMid meet" font-family="Helvetica Neue,Arial,sans-serif">${body}</svg>`};
 let FLAT = false;

 const ball = (x, y, r, col, label = "", fs = 0, sh = true, tc = "#fff") => FLAT ? `<circle cx="${x}" cy="${y}" r="${r}" fill="${col}" stroke="${shade(col, 0.7)}" stroke-width="1.5"/>` + (label ? txt(x, y + (fs || r * 0.7) * 0.36, label, tc, fs || Math.round(r * 0.7), "middle", 700) : "") : (sh ? `<ellipse cx="${x}" cy="${y + r + Math.max(4, r * 0.25)}" rx="${r * 0.8}" ry="${Math.max(2, r * 0.16)}" fill="#000" opacity=".13"/>` : "") +
  `<circle cx="${x}" cy="${y}" r="${r}" fill="url(#b${hex(col)})"/>` + (label ? txt(x, y + (fs || r * 0.7) * 0.36, label, tc, fs || Math.round(r * 0.7), "middle", 700) : "");
 const eBall = (x, y, r = 12, sh = false) => ball(x, y, r, "#E29A2D", "e⁻", Math.round(r * 1.05), sh);
 const head = (fx, fy, x2, y2, col, w) => {const a = Math.atan2(y2 - fy, x2 - fx), L = 7 + w * 2.2, q = t => `${(x2 - L * Math.cos(a + t)).toFixed(1)},${(y2 - L * Math.sin(a + t)).toFixed(1)}`; return `<polygon points="${x2},${y2} ${q(0.42)} ${q(-0.42)}" fill="${col}"/>`};
 const arrow = (x1, y1, x2, y2, col = "#333F4A", w = 2.5, dash = "") => {const a = Math.atan2(y2 - y1, x2 - x1), k = 5 + w * 1.5; return `<line x1="${x1}" y1="${y1}" x2="${(x2 - k * Math.cos(a)).toFixed(1)}" y2="${(y2 - k * Math.sin(a)).toFixed(1)}" stroke="${col}" stroke-width="${w}" ${dash ? `stroke-dasharray="${dash}"` : ""}/>` + head(x1, y1, x2, y2, col, w)};
 const curve = (x1, y1, cx, cy, x2, y2, col = "#E29A2D", w = 3, dash = "2 7") => `<path d="M${x1} ${y1} Q${cx} ${cy} ${x2} ${y2}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" ${dash ? `stroke-dasharray="${dash}"` : ""}/>` + head(cx, cy, x2, y2, col, w);
 const bond = (x1, y1, x2, y2, w = 6) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#9aa4ab" stroke-width="${w}" stroke-linecap="round"/><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#d5dadd" stroke-width="${w * 0.35}" stroke-linecap="round"/>`;
 /* isometric projection: x right-front, y left-front, z up */
 const iso = (x, y, z, o) => [o.x + (x - y) * 0.866 * o.s, o.y + (x + y) * 0.5 * o.s - z * o.s];
 const poly = (pts, fill, o, st = "rgba(28,36,43,.35)") => `<polygon points="${pts.map(p => iso(...p, o).map(v => v.toFixed(1)).join(",")).join(" ")}" fill="${fill}" stroke="${st}" stroke-width="1"/>`;

 /* vertical cylinder seen slightly from above: top ellipse centre (cx, ty) */

   `<path d="M${cx - rx} ${by - h} L${cx - rx} ${by} A${rx} ${ry} 0 0 0 ${cx + rx} ${by} L${cx + rx} ${by - h}" fill="none" stroke="#7d8a93" stroke-width="2.5"/><ellipse cx="${cx}" cy="${by - h}" rx="${rx}" ry="${ry}" fill="none" stroke="#7d8a93" stroke-width="2"/>` +
   `<path d="M${cx - rx + 8} ${by - h + 12} L${cx - rx + 8} ${by - 10}" stroke="#fff" stroke-width="5" opacity=".55" stroke-linecap="round"/>`};
 /* a chip as an isometric block: Si wafer, SiO2 and Cu lines; returns the svg body */
 const chip = (o, {X = 7, Y = 5.2, zSi = 1.6, zOx = 1.3, cu = [1.0, 3.0, 5.0], labels = true, fs = 17} = {}) => {let s = box(0, 0, 0, X, Y, zSi, "#B9C1C6", o) + box(0, 0, zSi, X, Y, zOx, "#DFC98F", o);
  cu.forEach(x => {s += box(x, 0, zSi + 0.35, 0.9, Y, zOx - 0.35 + 0.02, "#BE654C", o, "tf")});
  if (labels){const rf = (y, z, t) => {const [a, b] = iso(X, y, z, o); return txt(a, b, t, "#1C242B", fs, "middle", 700)}; s += rf(Y / 2, zSi * 0.4, "Si") + rf(Y / 2, zSi + zOx * 0.35, "SiO₂");
   const [cx, cy] = iso(cu[1] + 0.45, Y, zSi + 0.75, o); s += txt(cx, cy + 5, "Cu", "#fff", fs - 2, "middle", 700)}

 const atom = (cx, cy, R, {p = 3, n = 3, e = 3, label = ""} = {}) => {let s = "";

  const nuc = []; const k = p + n; for (let i = 0; i < k; i++){const a = i * 2.39996, r = 7 * Math.sqrt(i); nuc.push([cx + r * Math.cos(a), cy + r * Math.sin(a), i % 2 === 0 && nuc.filter(q => q[2]).length < p || nuc.filter(q => !q[2]).length >= n])}
  nuc.sort((a, b) => a[1] - b[1]).forEach(([x, y, isP]) => {s += ball(x, y, 9, isP ? "#BE654C" : "#8E9AA3", "", 0, false)});
  for (let i = 0; i < e; i++){const rot = [0, 60, 120][i % 3] * Math.PI / 180, t = 0.7 + i * 2.1, ex = R * Math.cos(t), ey = R * 0.32 * Math.sin(t); s += eBall(cx + ex * Math.cos(rot) - ey * Math.sin(rot), cy + ex * Math.sin(rot) + ey * Math.cos(rot), 10)}

<div class="panel" style="margin-top:12px"><div class="math" style="font-size:20px;line-height:1.6">atoms per cell = corners/8 + faces/2 + inside<br>Cu (face-centered): 8/8 + 6/2 = <b>4</b><br>Si (diamond): 8/8 + 6/2 + 4 = <b>8</b></div></div></div>
<div class="col"><ul class="b xs"><li>A unit cell is the smallest box that, repeated, builds the crystal</li>
<li>A corner atom is shared by 8 cells, a face atom by 2; an atom inside belongs to one</li>
<li>a is the edge length of the cube (the lattice constant)</li>
<li>Class 3 uses these counts to link the mass of a wafer to its number of atoms</li></ul>${ART(picCells(), 250)}</div></div>`,
draw:()=>{document.getElementById("cells").innerHTML = `<tr><th>Metal or Si</th><th>Lattice</th><th class="n">a, nm</th><th class="n">Atoms per cell</th></tr>` +
 LC().cells.map(c => `<tr><td>${c.name}</td><td>${c.lattice}</td><td class="n">${c.a_nm.toFixed(4)}</td><td class="n">${c.atoms}</td></tr>`).join("")},
py:{title:"Atoms per cubic unit cell", sub:"bonding_lab.atoms_per_cell()", code:
`from bonding_lab import atoms_per_cell
for name in ["Cu", "W", "Si"]:
    c = atoms_per_cell(name)
    print(name, c["lattice"], c["atoms"])`,
out:()=>LC().cells.map(c=>`${c.name} ${c.lattice} ${py6(c.atoms)}`).join("\n")}});

S.push({kicker:"Part 2 · Demo", title:"How much does a chip wire resist?", html:()=>`<div class="body"><div class="col w55"><div class="panel"><div class="math" style="font-size:22px;line-height:1.6">R = ρL / A, &nbsp; A = w × t</div>
<p class="note" style="margin-top:4px">A wire 1 mm long (L), w wide and t = 200 nm thick.</p></div>
<div class="ctrl" style="margin-top:10px"><button id="lm0" class="on">Cu</button><button id="lm1">Al</button><button id="lm2">W</button>&nbsp; Width w <input type="range" id="lw" min="50" max="200" step="10" value="100"><b id="lwv"></b></div>
<div class="kpi"><div>ρ, Ω·m<b id="lrho"></b></div><div>A, m²<b id="lA"></b></div><div>R, Ω<b class="a" id="lR"></b></div></div>
<div class="panel" style="display:block;margin-top:12px;font-size:19px;line-height:1.5" id="lnote"></div></div>
<div class="col"><table class="t" style="font-size:17px" id="ltab"></table>
<ul class="b xs" style="margin-top:12px"><li>Al wiring was replaced by Cu from the late 1990s: the same wire resists about 37% less</li>
<li>W is kept for the short contacts that touch the transistors: it fills narrow holes well, and Cu must be kept away from Si, which it diffuses into and damages</li>
<li>In wires only tens of nm wide, ρ rises above these bulk values; later classes return to this</li></ul></div></div>`,
draw:()=>{const L = LC().line, M = ["Cu", "Al", "W"], rho = m => LC().rho.find(r => r.material === m).rho; let k = 0;
 document.getElementById("ltab").innerHTML = `<tr><th>Same 100 nm wire in</th><th class="n">R, Ω</th><th class="n">× Cu</th></tr>` + LC().lines.map(q => `<tr><td>${q.material}</td><td class="n">${q.R.toFixed(0)}</td><td class="n">${q.vs_Cu.toFixed(2)}</td></tr>`).join("");
 const go = () => {const w = +document.getElementById("lw").value * 1e-9, Rr = lineR(rho(M[k]), L.L, w, L.t);
  M.forEach((_, i) => document.getElementById("lm" + i).classList.toggle("on", i === k)); document.getElementById("lwv").textContent = (w * 1e9).toFixed(0) + " nm";
  document.getElementById("lrho").innerHTML = sci(rho(M[k])); document.getElementById("lA").innerHTML = sci(w * L.t); document.getElementById("lR").textContent = Rr.toFixed(0);
  document.getElementById("lnote").innerHTML = `Halve the width and R doubles: R is proportional to 1/A. At 100 nm the Cu wire is ${LC().lines[0].R.toFixed(0)} Ω.`};
 M.forEach((_, i) => document.getElementById("lm" + i).onclick = () => {k = i; go()}); document.getElementById("lw").oninput = go; go()},
py:{title:"Resistance of the same wire in three metals", sub:"bonding_lab.line_table()", code:
`from bonding_lab import line_table, r6
for q in line_table():
    print(q["material"], "R =", r6(q["R"]), "ohm,", r6(q["vs_Cu"]), "x Cu")`,
out:()=>LC().lines.map(q=>`${q.material} R = ${py6(q.R)} ohm, ${py6(q.vs_Cu)} x Cu`).join("\n")},
notes:"The 37% comes from 1 − 1.68/2.65. Ask students to find it from the table."});

S.push({kicker:"Part 2 · The insulator", title:"How little current crosses 100 nm of SiO₂?", html:()=>`<div class="body"><div class="col w55"><div class="panel"><div class="math" style="font-size:20px;line-height:1.7">
R = ρt / A = (10<sup>16</sup> Ω·m)(100 × 10<sup>−9</sup> m) / (10<sup>−12</sup> m²)<br>= <b>${sci(LC().leak.R, 0)} Ω</b><br>I = V / R = 1 V / 10<sup>21</sup> Ω = <b>${sci(LC().leak.I, 0)} A</b></div></div>
<p class="note">t: layer thickness; A: area of a 1 µm × 1 µm pad above the layer. An order-of-magnitude estimate.</p></div>
<div class="col"><ul class="b sm"><li>10<sup>−21</sup> A is about one electron every 3 minutes</li>
<li>So between two wires, SiO<sub>2</sub> stops the current almost completely</li>
<li>Very thin oxides behave differently: electrons can tunnel through a few nm. That is a topic for device courses</li></ul></div></div>`,
notes:"One electron per 3 minutes: 1.602e-19 C / 1e-21 A = 160 s."});

S.push({kicker:"Part 2 · Choosing with reasons", title:"Each chip material is chosen for a number", html:()=>`<div class="body"><div class="col"><table class="t" style="font-size:18px">

S.push({kicker:"Summary", title:"What to take from today", html:()=>`<div class="body"><div class="col w45"><table class="t" style="font-size:17px">
<tr><th>Quantity</th><th class="n">Value</th></tr>
<tr><td>Δχ Si–O, Na–Cl</td><td class="n">1.7, 2.1</td></tr>
<tr><td>ρ(SiO<sub>2</sub>) / ρ(Cu)</td><td class="n">≈ 10<sup>${LC().orders_SiO2_Cu.toFixed(1)}</sup></td></tr>
<tr><td>1 mm Cu wire, 100 × 200 nm</td><td class="n">${LC().lines[0].R.toFixed(0)} Ω</td></tr>
<tr><td>Same wire in Al, in W</td><td class="n">${LC().lines[1].R.toFixed(0)}, ${LC().lines[2].R.toFixed(0)} Ω</td></tr>
<tr><td>Atoms per cell: Cu, W, Si</td><td class="n">4, 2, 8</td></tr>
<tr><td>Fused silica vs quartz</td><td class="n">${LC().silica.percent_lower.toFixed(0)}% less dense</td></tr></table></div>
<div class="col"><ul class="b xs"><li>Metallic: electrons shared by the whole solid, so metals conduct</li>
<li>Covalent: electron pairs fixed between atoms; ionic: ions fixed in place. Both conduct poorly as solids</li>
<li>Δχ sorts bonds: below 0.4 nonpolar, 0.4 to 1.8 polar, above 1.8 ionic. A guide, with exceptions</li>
<li>A bonding label does not settle conduction: graphite conducts, Si is a semiconductor</li>
<li>Crystals repeat; amorphous solids do not. The same SiO<sub>2</sub> differs in density</li>
<li>R = ρL/A: choose the material by ρ, then size the wire</li></ul></div></div>`});

 const au=document.getElementById("narr"),bar=document.getElementById("nbar"),cap=document.getElementById("cap"),play=document.getElementById("nPlay"),tm=document.getElementById("nTime"),msg=document.getElementById("nMsg");
 document.getElementById("dock").style.display="flex";document.getElementById("help").style.display="none";let on=false,lang="off",slideIdx=-1;
 const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
 lang=ls("cc-lang")||"off";if(lang!=="en")lang="off";const sp=ls("narr-speed");if(sp)document.getElementById("nSpeed").value=sp;
 const fmtT=t=>isFinite(t)?`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,"0")}`:"0:00";
 const S_=i=>NARR.slides[i];
 function load(i){slideIdx=i;const s=S_(i);if(!s){au.removeAttribute("src");return}au.src=s.file;au.playbackRate=+document.getElementById("nSpeed").value;tm.textContent=`0:00 / ${fmtT(s.duration)}`;showCap(0)}
 function setPlayUI(){play.textContent=au.paused?"▶ Play":"❚❚ Pause";play.classList.toggle("on",!au.paused)}
 // captions sit in their own band under the slide; long lines shrink to fit the band
 window.capRefit=()=>{let f=parseFloat(cap.dataset.fs)||18;cap.style.fontSize=f+"px";while(cap.scrollHeight>cap.clientHeight+1&&f>11){f-=1;cap.style.fontSize=f+"px"}};
 function showCap(t){const s=S_(slideIdx);let c=null;if(s&&lang!=="off"){for(const q of s.cues){if(t>=q.s-0.05)c=q;else break}}
  const txt=(!c||(au.paused&&au.currentTime===0&&!on))?"":c.en;if(cap.textContent!==txt){cap.textContent=txt;capRefit()}}

 window.ccCycle=()=>{lang=lang==="off"?"en":"off";ls("cc-lang",lang);ccUI()};
 // "on" means the student is listening: it starts with Play and ends with Pause or Stop.
 // Slides change only when the student moves; the new slide's narration then starts if "on".
 window.narrToggle=()=>{if(au.paused){on=true;if(slideIdx!==cur)load(cur);if(au.ended)au.currentTime=0;msg.textContent="";au.play().catch(()=>{msg.textContent="Press Play again to start audio."})}else{on=false;au.pause()}};

 document.getElementById("nPrev").onclick=()=>show(cur-1);document.getElementById("nNext").onclick=()=>show(cur+1);

 const q=new URLSearchParams(location.search);
 if(q.get("narrate")==="1"){const ov=document.getElementById("startov");ov.style.display="flex";document.getElementById("startBtn").onclick=()=>{ov.style.display="none";if(lang==="off"){lang="en";ls("cc-lang",lang)}ccUI();on=true;load(cur);au.play().catch(()=>{})}}
 ccUI();setTimeout(()=>{if(slideIdx<0)load(cur)},0);
})();

build();drawAll();fit();show((parseInt(location.hash.slice(1))||1)-1);
